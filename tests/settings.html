<!doctype html>
<meta charset="utf-8">
<title>衣柜设置回归检查</title>
<p id="result" role="status">正在检查衣柜设置…</p>
<div id="extensionsMenu"></div>
<textarea id="send_textarea"></textarea>
<button id="mes_stop" style="display:none">停止</button>
<script>
  // 通过本地 HTTP 在 Chromium 打开本页，模拟酒馆同源接口和独立存储。
  const storageKey = 'zhenxin.wardrobe.v1';
  const oldDescription = '原套装介绍\n【上装】浅色衬衣\n【袜】灰色短袜\n【鞋】软底鞋\n【配饰】手表\n【配饰】帽子\n【未知】保留原文';
  const duplicateDescription = '【下装】黑长裤\n【下装】灰长裙\n【外套】羊毛外套';
  const items = [
    { id: 'old', title: '历史套装', desc: oldDescription },
    { id: 'duplicate', title: '重复槽位', desc: duplicateDescription },
  ].map(item => ({ owner: 'Char 角色', category: '日常便装', rating: 'SFW', tags: [], boundChars: [], ...item }));
  const store = new Map([[storageKey, JSON.stringify({ items, settings: {} })]]);
  let failWardrobeSave = false;
  Object.defineProperty(window, 'localStorage', {
    value: {
      getItem: key => store.get(key) ?? null,
      /** @param {string} key 存储键。 @param {string} value 快照内容。 @returns {void} 模拟浏览器写入及容量不足。 */
      setItem(key, value) {
        if (failWardrobeSave && key === storageKey) throw new DOMException('存储已满', 'QuotaExceededError');
        store.set(key, value);
      },
    },
  });
</script>
<script src="../index.json"></script>
<script>
  /** 条件不成立时报告对应的用户操作，便于定位回归。 */
  function check(condition, message) {
    if (!condition) throw new Error(message);
  }

  /** @returns {Promise<void>} 检查跨衣柜批量改分类、待整理和同一个收藏按钮。 */
  async function runBatchManagementCases() {
    const target = '正装礼服', original = '日常便装';
    const hiddenId = 'WD-2946888794-1717775839';
    const inventory = [
      { id: hiddenId, title: '批量外套', fav: true },
      { id: 'remote', title: '批量衬衣', wardrobeId: 'wb-remote' },
      { id: 'blank', title: '批量空白卡', desc: '' },
      { id: 'other', title: '未勾选的服饰' },
    ].map(item => ({ ...items[0], wardrobeId: 'wb-main', category: original, desc: '初始描述', ...item }));
    store.set(storageKey, JSON.stringify({
      items: inventory, settings: {}, wardrobes: [{ id: 'wb-main', name: '主衣柜' }, { id: 'wb-remote', name: '第二衣柜' }],
    }));
    await reloadWardrobe();
    WardrobePanel.open();
    const root = document.getElementById('wardrobe-host').shadowRoot;
    /** @param {string} selector 元素选择器。 @returns {HTMLElement} 查到的元素。 */
    const get = selector => root.querySelector(selector);
    /** @param {string} name 动作名。 @param {string} [scope] 作用域。 @returns {void} 执行动作。 */
    const act = (name, scope = '') => get(`${scope} [data-ui="${name}"]`).click();
    /** @param {string} id 服饰 ID。 @returns {object} 快照中的服饰。 */
    const saved = id => JSON.parse(store.get(storageKey)).items.find(item => item.id === id);
    const first = `#grid [data-id="${hiddenId}"]`;
    const favorite = get('#btnBatchFavorite');
    const move = get('[data-ui="open-batch-category"]');
    const count = get('#batchCount');
    check(!get(first).textContent.includes(hiddenId) && get('#inspId').textContent === `#${hiddenId}`
      && get('#matrixActiveBadge').textContent.includes('槽位') && get('#modalLightbox .badge').textContent === '正面视图', '应只在右栏显示当前服饰编号并保留功能徽标');
    const search = get('#gallerySearch');
    search.value = '批量';
    search.dispatchEvent(new Event('input'));
    await new Promise(resolve => requestAnimationFrame(resolve));
    act('toggle-batch-mode');
    check(favorite.disabled && move.disabled, '无勾选时应禁用两个新批量动作');
    act('batch-select-all');
    check(count.textContent === '3' && favorite.textContent.trim() === '收藏', '混选时应提供补齐收藏');
    failWardrobeSave = true;
    favorite.click();
    check(saved(hiddenId).fav && !saved('remote').fav && count.textContent === '3', '收藏保存失败应保留原状态和勾选');
    failWardrobeSave = false;
    favorite.click();
    check(saved('remote').fav && saved('blank').fav && !saved('other').fav && count.textContent === '3'
      && favorite.textContent.trim() === '取消收藏' && get('#galleryFavoriteCount').textContent === '2'
      && get('#grid [data-id="remote"] [data-ui="toggle-fav"]').getAttribute('aria-pressed') === 'true', '收藏成功后应同步星标、计数和按钮动作');
    move.click();
    const select = get('#batchCategory');
    const submit = get('#batchCategoryForm');
    check([...select.options].some(option => option.value === '待整理'), '目标应含待整理');
    select.value = target;
    failWardrobeSave = true;
    submit.requestSubmit();
    check(get('#modalBatchCategory').open && saved('remote').category === original && count.textContent === '3', '分类保存失败应保留弹窗、原分类和勾选');
    failWardrobeSave = false;
    submit.requestSubmit();
    check(!get('#modalBatchCategory').open && saved('remote').category === target && saved('remote').wardrobeId === 'wb-remote'
      && saved(hiddenId).category === target && saved('blank').category === target && saved('other').category === original
      && count.textContent === '0' && !get('#gwrapBar').hidden, '移动分类应保留衣柜归属、清空勾选并停留在批量模式');
    get('[data-filter="favorite"]').click();
    act('batch-select-all');
    check(count.textContent === '2' && favorite.textContent.trim() === '取消收藏', '收藏快筛的勾选应全部可取消');
    favorite.click();
    check(!saved(hiddenId).fav && !saved('blank').fav && saved('remote').fav && !get('#grid .card')
      && get('#galleryFavoriteCount').textContent === '0' && favorite.disabled, '取消后应移除当前收藏结果并保留其它衣柜未勾选的收藏');
    act('toggle-batch-mode');
    get('[data-filter="unsorted"]').click();
    check(get('#grid [data-id="blank"]') && !get(first), '空白卡仍应在待整理中');
    get('#grid [data-id="blank"] .cmeta-t').click();
    get('#inspDesc').value = '补充的羊毛材质';
    get('#inspDesc').dispatchEvent(new Event('input', { bubbles: true }));
    act('save-item-basics');
    get(`#galleryCategories [data-category="${target}"]`).click();
    check(get('#grid [data-id="blank"]') && get(first), '空白卡补充描述后应进入先前批量设置的分类');
  }

  /** @returns {Promise<void>} 检查标签编辑、竖向预览、文件替换、上传失败及保存重试。 */
  async function runAddOutfitCases() {
    const png = 'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAEElEQVR4nGOQ1AgAIgYIBQAPDgJFh8uQegAAAABJRU5ErkJggg==';
    const bytes = Uint8Array.from(atob(png), byte => byte.charCodeAt(0));
    const originalFetch = window.fetch, originalHost = window.SillyTavern;
    const uploads = [], deletions = [];
    let failSide = '', delayUpload = false, aborted = false;
    window.SillyTavern = { getContext: () => ({ getRequestHeaders: () => ({ 'Content-Type': 'application/json' }) }) };
    /** @param {string} url 请求地址。 @param {RequestInit} options 请求参数。 @returns {Promise<Response>} 模拟酒馆文件接口。 */
    window.fetch = async (url, options) => {
      if (url === '/api/files/upload') {
        const { name, data } = JSON.parse(options.body);
        uploads.push({ name, data });
        if (delayUpload) {
          return new Promise((resolve, reject) => {
            options.signal.addEventListener('abort', () => {
              aborted = true;
              reject(options.signal.reason);
            }, { once: true });
          });
        }
        if (failSide && name.includes(failSide)) return new Response(null, { status: 500 });
        return Response.json({ path: `/user/files/${name}` });
      }
      if (url === '/api/files/delete') {
        deletions.push(JSON.parse(options.body).path);
        return new Response();
      }
      return originalFetch(url, options);
    };
    try {
      await reloadWardrobe();
      WardrobePanel.open();
      const root = document.getElementById('wardrobe-host').shadowRoot;
      /** @param {string} id 控件 ID。 @returns {HTMLElement} 对应元素。 */
      const get = id => root.getElementById(id);
      /** @param {string} selector 选择器。 @returns {void} 点击当前实例中的控件。 */
      const click = selector => root.querySelector(selector).click();
      /** @param {string} side 图片视角。 @param {string} name 文件名。 @param {string} [mime] 文件类型。 @returns {void} 模拟选取文件。 */
      function pick(side, name, mime = 'image/png') {
        const transfer = new DataTransfer();
        transfer.items.add(new File([bytes], name, { type: mime }));
        const picker = get(`add${side}File`);
        picker.files = transfer.files;
        picker.dispatchEvent(new Event('change'));
      }
      /** @param {Function} condition 结束条件。 @param {string} message 条件未达时的错误。 @returns {Promise<void>} 等待浏览器图片和上传回调。 */
      async function until(condition, message) {
        for (let attempt = 0; attempt < 120 && !condition(); attempt++) {
          await new Promise(resolve => requestAnimationFrame(resolve));
        }
        check(condition(), message);
      }
      /** @returns {object|undefined} 本用例新增的服饰。 */
      const saved = () => JSON.parse(store.get(storageKey)).items.find(item => item.title === '新增图片和标签');
      click('.toolbar-r [data-ui="open-add-modal"]');
      get('addTitle').value = '新增图片和标签';
      const input = get('addTags');
      /** @param {string} value 当前输入。 @param {string} [inputType] 输入来源。 @returns {void} 触发分隔和组字逻辑。 */
      const type = (value, inputType = 'insertText') => {
        input.value = value;
        input.dispatchEvent(new InputEvent('input', { inputType }));
      };
      /** @returns {string} 当前表单标签顺序。 */
      const tags = () => [...root.querySelectorAll('#addTagValues .chip-edit')].map(button => button.textContent).join(',');
      input.dispatchEvent(new CompositionEvent('compositionstart'));
      type('pin yin ');
      check(!tags(), '组字期间不得拆分拼音');
      input.value = '羊毛，';
      input.dispatchEvent(new CompositionEvent('compositionend'));
      type('羊毛 #黑色,可删除', 'insertFromPaste');
      check(tags() === '#羊毛,#黑色,#可删除', '应提交中英文分隔符和多标签粘贴并去重');
      click('#addTagValues [aria-label="编辑标签 羊毛"]');
      check(root.activeElement === input && input.value === '羊毛' && input.selectionEnd === 2, '点击标签名称应该选中原文字');
      type('羊绒');
      input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
      check(tags() === '#羊绒,#黑色,#可删除' && get('modalAddOutfit').open, '回车应原位改名并留在表单');
      click('#addTagValues [aria-label="编辑标签 黑色"]');
      type('会取消');
      input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      check(tags() === '#羊绒,#黑色,#可删除' && get('modalAddOutfit').open, '编辑时 Esc 应恢复原标签');
      click('#addTagValues [aria-label="移除标签 可删除"]');
      type('未按回车');
      const front = get('addFront'), back = get('addBack'), preview = get('addFrontPreview');
      const link = 'https://example.test/back.png';
      back.value = link;
      back.dispatchEvent(new Event('change'));
      pick('Front', '正面.png');
      await until(() => preview.naturalWidth === 2, '本地正面图应立即预览');
      const portrait = preview.parentElement.getBoundingClientRect();
      const backPortrait = get('addBackPreview').parentElement.getBoundingClientRect();
      const imageBox = preview.getBoundingClientRect();
      check(Math.abs(portrait.width / portrait.height - .75) < .02 && imageBox.height <= portrait.height
        && getComputedStyle(preview).objectFit === 'contain', '竖向预览应限制原图布局尺寸并完整适配');
      const details = get('addOutfitForm').firstElementChild.getBoundingClientRect();
      const media = get('addOutfitForm').lastElementChild.getBoundingClientRect();
      check(matchMedia('(max-width:760px)').matches ? media.top >= details.bottom : media.left >= details.right,
        '窄屏图片栏应在表单下方，桌面应在右栏');
      check(Math.abs(portrait.top - backPortrait.top) < 1 && Math.abs(portrait.width - backPortrait.width) < 1
        && portrait.right <= backPortrait.left && backPortrait.right <= media.right
        && front.getBoundingClientRect().top >= portrait.bottom && back.getBoundingClientRect().top >= backPortrait.bottom,
        '正背面等宽预览应在所有屏宽下左右并排，图片链接分别放在各自预览下方');
      pick('Front', '错误.txt', 'text/plain');
      check(get('addFrontFilename').textContent === '正面.png' && get('addBackPreview').src === link, '选入无效文件应保留当前图片和另一面链接');
      front.value = 'https://example.test/front.png';
      front.dispatchEvent(new Event('input'));
      front.dispatchEvent(new Event('change'));
      check(preview.src === front.value && !get('addFrontFilename').textContent, '编辑链接应替换当前文件来源');
      pick('Front', '正面.png');
      pick('Back', '背面.png');
      check(!front.value && !back.value, '选文件时应清空同一视角的链接');
      get('addBackClear').click();
      check(preview.hasAttribute('src') && !get('addBackPreview').hasAttribute('src'), '清除应只作用于指定视角');
      pick('Back', '背面.png');
      const form = get('addOutfitForm'), submit = root.querySelector('[form="addOutfitForm"][value="equippedUser"]');
      failSide = 'backUrl';
      form.requestSubmit(submit);
      await until(() => deletions.length === 1 && !submit.disabled, '背面上传失败应清理已上传正面并恢复提交');
      check(get('modalAddOutfit').open && get('modalAddOutfit-error').textContent.includes('背面') && !saved()
        && tags() === '#羊绒,#黑色,#未按回车' && get('addBackFilename').textContent === '背面.png', '上传失败应保留标题、已编辑标签和所选文件');
      failSide = '';
      failWardrobeSave = true;
      form.requestSubmit(submit);
      await until(() => deletions.length === 3 && !submit.disabled, '快照失败应尝试清理两面文件并允许重试');
      check(!saved() && get('modalAddOutfit-error').textContent.includes('浏览器存储'), '存储失败应保留表单并提示');
      failWardrobeSave = false;
      delayUpload = true;
      form.requestSubmit(submit);
      await until(() => uploads.length === 5, '应进入可取消的上传请求');
      const oldPreview = preview.src;
      click('#modalAddOutfit .modal-f [data-ui="close-modals"]');
      await until(() => aborted, '关闭弹窗应取消上传');
      check(!preview.hasAttribute('src') && !saved(), '取消上传应释放预览并且不创建衣柜卡片');
      delayUpload = false;
      click('.toolbar-r [data-ui="open-add-modal"]');
      check(preview.src.startsWith('blob:') && preview.src !== oldPreview, '重开草稿时应重建临时预览');
      form.requestSubmit(submit);
      await until(() => saved() && !get('modalAddOutfit').open, '重试后应成功添加并装备');
      check(saved().equippedUser && saved().frontUrl.includes('/user/files/')
        && saved().backUrl.includes('/user/files/') && saved().frontUrl !== saved().backUrl
        && uploads.every(upload => upload.data === png), '应分别保存两面地址并发送实际图片数据');
      click('.toolbar-r [data-ui="open-add-modal"]');
      check(!get('addTitle').value && !tags() && !preview.hasAttribute('src'), '成功后应清空新增草稿');
    } finally {
      failWardrobeSave = false;
      window.fetch = originalFetch;
      window.SillyTavern = originalHost;
    }
  }

  /**
   * 用原生文件对象模拟选择预设文件。
   * @param {HTMLInputElement} field 预设文件输入框。
   * @param {HTMLElement} toast 设置弹窗的反馈区域。
   * @param {string} content 要导入的文本内容。
   * @returns {Promise<string>} 导入反馈的类型。
   */
  function importFile(field, toast, content) {
    return new Promise((resolve, reject) => {
      const observer = new MutationObserver(() => {
        observer.disconnect();
        clearTimeout(timer);
        resolve(toast.dataset.kind);
      });
      const timer = setTimeout(() => {
        observer.disconnect();
        reject(new Error('导入预设后没有收到结果'));
      }, 3000);
      observer.observe(toast, { attributeFilter: ['data-kind'] });
      const files = new DataTransfer();
      files.items.add(new File([content], 'wardrobe-preset.json', { type: 'application/json' }));
      field.files = files.files;
      field.dispatchEvent(new Event('change', { bubbles: true }));
    });
  }

  /** @returns {Promise<void>} 重新装载衣柜脚本，走实际卸载和快照恢复逻辑。 */
  function reloadWardrobe() {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = '../index.json';
      script.onload = resolve;
      script.onerror = reject;
      document.head.append(script);
    });
  }

  /** 通过悬浮球和扩展菜单操作同一个面板，并验证持久化与预设文件往返。 */
  async function run() {
    let root = document.getElementById('wardrobe-host').shadowRoot;
    const byId = id => root.getElementById(id);
    /** @param {string} id 单选组编号。 @returns {string} 当前选中值。 */
    const selected = id => byId(id).querySelector(':checked').value;
    const click = selector => root.querySelector(selector).click();
    const action = name => click(`[data-ui="${name}"]`);
    const saved = () => JSON.parse(store.get(storageKey)).settings;
    const reopen = () => {
      document.getElementById('wardrobe-menu-item').click();
      action('open-settings');
    };

    check(!byId('fabWrap').hidden, '缺少悬浮球设置的旧快照应默认显示悬浮球');
    byId('fabBall').click();
    action('fab-toggle-plugin');
    action('fab-open-wardrobe');
    action('open-settings');
    click('[data-pane="paneDisplay"]');
    byId('showFab').click();
    action('save-settings');
    check(byId('fabWrap').hidden && saved().showFab === false, '保存后应隐藏悬浮球');
    action('close');
    reopen();
    check(byId('modalSettings').open, '插件停用且悬浮球隐藏时仍应能打开设置');

    click('[data-pane="panePreset"]');
    action('new-wardrobe-preset');
    const draftId = byId('wardrobePreset').value;
    byId('wardrobePresetName').value = '回归预设';
    click('[data-pane="paneDisplay"]');
    action('toggle-show-tags');
    byId('showFab').click();
    click('[data-pane="paneInject"]');
    check(selected('injectContent') === 'text' && selected('injectPosition') === 'user_end'
      && byId('injectHistory').value === '12', '旧快照应显示内容、位置和回看默认值');
    check(selected('extraApiMode') === 'off' && byId('selectionOptions').hidden, '缺少开关时应关闭额外 API 并隐藏选装字段');
    click('#extraApiMode input[value="enabled"] + span');
    check(selected('extraApiMode') === 'enabled' && !byId('selectionOptions').hidden, '开启选装后应显示选装字段');
    for (const value of ['context_end', 'user_end', 'system_end']) {
      click(`#injectPosition input[value="${value}"] + span`);
      check(selected('injectPosition') === value, '主聊天位置应能独立选择');
    }
    for (const value of ['image', 'text', 'both']) {
      click(`#injectContent input[value="${value}"] + span`);
      check(selected('injectContent') === value && byId('injectContent').querySelectorAll(':checked').length === 1, '发送类型应能直接点击并保持单选');
    }
    byId('injectHistory').value = '0';
    byId('injectInstruction').value = '优先日常搭配';
    byId('injectDepth').value = '3';
    click('[data-pane="panePreset"]');
    action('save-wardrobe-preset');
    check(saved().activeWardrobePresetId === 'default' && saved().showFab === false && saved().autoSelect === false, '保存预设时应保留已应用的预设和全局开关');
    action('apply-wardrobe-preset');
    check(saved().activeWardrobePresetId === draftId && byId('gwrap').classList.contains('hide-tags'), '应用应持久化选中预设及显示效果');

    // 捕获下载地址以校验真实导出内容，直接打开测试页时不会产生下载文件。
    let exported;
    const anchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () { exported = decodeURIComponent(this.href.split(',')[1]); };
    try {
      action('export-wardrobe-preset');
    } finally {
      HTMLAnchorElement.prototype.click = anchorClick;
    }
    const record = JSON.parse(exported);
    check(record.name === '回归预设' && record.injectDepth === '3' && !record.showTags && !('showFab' in record), '导出应保留预设选项及名称');
    check(record.injectPosition === 'system_end' && record.injectContent === 'both' && record.injectHistory === '0'
      && record.injectInstruction === '优先日常搭配' && !('autoSelect' in record), '应导出预设内的发送选项及零楼回看');
    const toast = byId('modalSettings').querySelector('.modal-toast');
    check(await importFile(byId('wardrobePresetFile'), toast, '{') === 'error', '损坏的 JSON 应提示错误');
    check(await importFile(byId('wardrobePresetFile'), toast, exported) === 'success', '导出的预设应能重新导入');
    const importedId = byId('wardrobePreset').value;
    check(importedId !== draftId && byId('wardrobePresetName').value === '回归预设（2）', '导入同名预设应保留原预设');
    action('apply-wardrobe-preset');
    check(saved().activeWardrobePresetId === importedId && byId('injectDepth').value === '3', '导入后应用应恢复发送选项');
    check(selected('injectPosition') === 'system_end' && selected('injectContent') === 'both'
      && byId('injectHistory').value === '0' && byId('injectInstruction').value === '优先日常搭配', '导入后应恢复各项发送设置');
    action('delete-wardrobe-preset');
    action('save-wardrobe-preset');

    action('save-outfit-split');
    const savedItems = () => JSON.parse(store.get(storageKey)).items;
    const children = savedItems().filter(item => item.splitParent === 'old');
    check(savedItems().find(item => item.id === 'old').desc === oldDescription, '拆分后应保留母卡和完整原文');
    check(children.length === 5 && children.every(item => !item.splitArchived), '确认拆分应生成五张子卡');
    action('open-item-split');
    action('undo-outfit-split');
    check(savedItems().filter(item => item.splitParent === 'old').every(item => item.splitArchived && children.some(child => child.id === item.id)), '撤销应归档子卡并保留原编号');
    action('open-item-split');
    action('save-outfit-split');
    check(savedItems().filter(item => item.splitParent === 'old' && !item.splitArchived).every(item => children.some(child => child.id === item.id)), '再次拆分应沿用已保存的子卡编号');

    action('open-item-split');

    action('close-modals');
    action('toggle-batch-mode');
    action('batch-select-all');
    action('open-batch-split');
    action('save-outfit-split');
    check(savedItems().filter(item => item.splitParent === 'duplicate').length === 1, '批量拆分应保留冲突待确认并只生成已确认子卡');
  }

  /** @returns {Promise<void>} 验证中栏全库搜索、三种视图和跨衣柜操作。 */
  async function runGalleryToolbarCases() {
    const main = 'wb-main', other = 'wb-other';
    const inventory = [
      { id: 'ten', title: '羊毛 10', desc: '【上装】精纺 ＷＯＯＬ 羊毛', tags: ['精纺羊毛'], lastUsedAt: 100 },

    ].map(item => ({ ...items[0], wardrobeId: main, desc: '冬装', ...item }));
    store.set(storageKey, JSON.stringify({
      items: inventory, settings: {}, wardrobes: [{ id: main, name: '主衣柜' }, { id: other, name: '旅行衣柜' }],
    }));
    await reloadWardrobe();
    WardrobePanel.open();
    const root = document.getElementById('wardrobe-host').shadowRoot;
    /** @param {string} selector 视图或操作选择器。 @returns {HTMLElement} 对应元素。 */
    const get = selector => root.querySelector(selector);
    /** @param {string} selector 操作选择器。 @returns {void} 点击对应控件。 */
    const click = selector => get(selector).click();
    /** @param {string} action 操作名称。 @param {string} [scope] 所在区域。 @returns {void} 点击操作按钮。 */
    const act = (action, scope = '') => click(`${scope} [data-ui="${action}"]`);
    /** @param {string} selector 下拉选择器。 @param {string} value 选项值。 @returns {void} 更改选项。 */
    const change = (selector, value) => {
      const input = get(selector);
      input.value = value;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    };
    /** @param {string} id 卡片 ID。 @returns {string} 当前可见视图中的卡片选择器。 */
    const card = id => `#grid .card[data-id="${id}"]`;
    /** @param {string} id 卡片 ID。 @returns {object} 当前已保存的卡片。 */
    const saved = id => JSON.parse(store.get(storageKey)).items.find(item => item.id === id);
    /** @param {string} [filter] 附加在卡片上的筛选条件。 @returns {string} 卡片显示顺序。 */
    const cards = (filter = '') => [...root.querySelectorAll(`#grid .card${filter}`)]
      .map(item => item.dataset.id).join(',');
    /** @returns {Promise<void>} 等一帧，让节流后的搜索先更新。 */
    const frame = () => new Promise(resolve => requestAnimationFrame(resolve));
    const search = get('#gallerySearch');
    /** @param {string} value 搜索文字。 @returns {Promise<void>} 搜索结果更新完毕。 */
    async function type(value) {
      search.value = value;
      search.dispatchEvent(new Event('input'));
      await frame();
    }
    /** @param {string} value 标签文字。 @returns {string} 标签筛选按钮的选择器。 */
    const tag = value => `#galleryTags [data-tag="${CSS.escape(value)}"]`;

    check(cards() === 'ten,two,boots' && !get(tag('玩家专用')) && get(tag('精纺羊毛')), '标签应来自当前左栏范围');
    root.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true, composed: true, cancelable: true }));
    check(root.activeElement === search, 'Ctrl+K 应在画廊聚焦搜索框');
    search.dispatchEvent(new CompositionEvent('compositionstart'));
    await type('yangmao');
    check(cards() === 'ten,two,boots', '中文组字期间应保留已提交的结果');
    search.value = '羊毛';
    search.dispatchEvent(new CompositionEvent('compositionend'));
    await frame();
    check(cards() === 'ten,two,player,remote,remote-split' && get('#galleryHeading').textContent === '全部衣柜'
      && get(`${card('remote')} .card-wardrobe`).textContent === '旅行衣柜', '搜索应跨归属、跨衣柜，并跳过归档卡');
    check(get('#galleryAllCount').textContent === '3' && get('#poolCharCount').textContent === '1 件'
      && get('#poolUserCount').textContent === '0 件', '全库搜索应保留原范围统计');
    await type('  wool  ');
    check(cards() === 'ten', '搜索材质应支持大小写和全半角匹配');
    await type('＃ 精纺羊');
    check(cards() === 'ten,remote', '# 搜索应只匹配标签');
    search.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));

  /** @returns {Promise<void>} 验证主衣柜保护，以及取消、迁移和一并删除的结果。 */

    store.set(storageKey, JSON.stringify({
      settings: {},

        { ...items[0], id: 'kept', wardrobeId: 'wb-main' },
        { ...items[0], id: 'removed', wardrobeId: 'wb-delete' },

      wardrobeGroups: [{ id: 'wg-test', name: '测试组合', wardrobeIds: ['wb-main', 'wb-delete'] }],
    }));
    await reloadWardrobe();
    WardrobePanel.open();
    const root = document.getElementById('wardrobe-host').shadowRoot;

    const openDelete = id => root.querySelector(`[data-wardrobe-id="${id}"] [data-ui="wardrobe-delete"]`).click();
    root.querySelector('[data-ui="open-wardrobe-mgr"]').click();
    const mainRow = root.querySelector('[data-wardrobe-id="wb-main"]');
    check(!mainRow.querySelector('[data-ui="wardrobe-delete"]'), '多个衣柜时也不能删除默认主衣柜');
    mainRow.querySelector('[data-ui="wardrobe-rename"]').click();
    mainRow.querySelector('input').value = '主衣柜改名';
    mainRow.querySelector('form').requestSubmit();
    check(mainRow.querySelector('.wardrobe-name').textContent === '主衣柜改名'
      && !mainRow.querySelector('[data-ui="wardrobe-delete"]'), '主衣柜可以改名，改名后仍受保护');
    const before = store.get(storageKey);
    openDelete('wb-delete');
    check(!option.checked && root.activeElement === cancel && details.textContent.includes('2 件服饰将移到「主衣柜改名」'), '删除弹窗应默认迁移到改名后的主衣柜并聚焦取消');
    option.click();
    check(details.textContent.includes('2 件服饰将一并删除') && details.textContent.includes('1 个组合'), '勾选后应更新服饰提示并保留组合提示');
    cancel.click();

    openDelete('wb-delete');
    check(!option.checked, '重新打开弹窗时应清除上次勾选');
    option.click();
    confirm.click();
    const deleted = JSON.parse(store.get(storageKey));
    check(deleted.items.map(item => item.id).join() === 'kept,moved' && !deleted.wardrobeGroups.length
      && !root.querySelector('[data-wardrobe-id="wb-delete"]'), '应删除该衣柜的全部服饰和失效组合，保留其他衣柜的服饰');
    check(root.activeElement === mainRow.querySelector('[data-ui="wardrobe-view"]'), '删除后相邻行是主衣柜时应聚焦独立查看');
    openDelete('wb-move');

      && migrated.items.every(item => item.wardrobeId === 'wb-main'), '默认确认应将服饰迁移到主衣柜');
  }

  /** @returns {Promise<void>} 验证右栏各页签、图片事务、离开确认及套装跳转。 */
  async function runInspectorCases() {
    const initial = {
      ...items[0], id: 'inspector', title: '右栏外套', desc: '原描述', fav: true, equippedUser: true,
      frontUrl: new URL('/user/files/original.png', location.href).href,
    };
    const other = { ...items[0], id: 'other', title: '另一件外套', boundWorldbook: '已移除世界书', wbEnabled: true };
    const outfit = {
      ...items[0], id: 'outfit', title: '现有搭配', frontUrl: initial.frontUrl,
      outfit: { slots: [], descriptionEdited: true, workshop: { rating: 'SFW', reason: '套装依据', description: '', prompt: '' } },
    };
    store.set(storageKey, JSON.stringify({
      items: [initial, other, outfit], settings: { apiMode: 'custom', apiModel: 'inspector-test', apiUrl: 'https://example.test/v1' },
    }));

    const nativeFetch = window.fetch, nativeHelper = window.TavernHelper, nativeHost = window.SillyTavern;
    const nativeGenerate = window.generateRaw, nativeStop = window.stopGenerationById;
    const png = 'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAEElEQVR4nGOQ1AgAIgYIBQAPDgJFh8uQegAAAABJRU5ErkJggg==';
    const bytes = Uint8Array.from(atob(png), ch => ch.charCodeAt(0));
    const uploads = [], removed = [], generations = [], stops = [];
    let failBack = false, holdUpload = false, uploadAborted = false, finishGeneration;
    const result = { rating: 'R-15', reason: '依据', description: 'AI 描述', prompt: 'black wool coat' };
    window.SillyTavern = { getContext: () => ({
      getRequestHeaders: () => ({ 'Content-Type': 'application/json' }),
      getWorldInfoNames: () => ['宿主后备'],
    }) };
    window.TavernHelper = { getWorldbookNames: () => ['真实世界书', '备用世界书'] };
    window.generateRaw = config => {
      generations.push(config);
      if (generations.length > 1) return Promise.resolve(JSON.stringify(result));
      return new Promise(resolve => { finishGeneration = resolve; });
    };
    window.stopGenerationById = id => stops.push(id);
    window.fetch = (url, options) => {
      if (url === '/api/files/upload') {
        const { name, data } = JSON.parse(options.body);
        uploads.push({ name, data });
        if (holdUpload) return new Promise((resolve, reject) => {
          options.signal.addEventListener('abort', () => {
            uploadAborted = true;
            reject(options.signal.reason);
          }, { once: true });
        });
        if (failBack && name.includes('backUrl')) return Promise.resolve(new Response(null, { status: 500 }));
        return Promise.resolve(Response.json({ path: `/user/files/${name}` }));
      }
      if (url === '/api/files/delete') {
        removed.push(JSON.parse(options.body).path);
        return Promise.resolve(new Response());
      }
      return nativeFetch(url, options);
    };
    try {
      await reloadWardrobe();
      WardrobePanel.open();
      /** @param {string} selector 选择器。 @returns {HTMLElement} 当前脚本实例的控件。 */
      const get = selector => document.getElementById('wardrobe-host').shadowRoot.querySelector(selector);
      /** @param {string} selector 选择器。 @returns {void} 点击控件。 */
      const click = selector => get(selector).click();
      /** @param {string} action 动作。 @param {string} [scope] 限定范围。 @returns {void} 点击动作。 */
      const act = (action, scope = '') => click(`${scope} [data-ui="${action}"]`);
      /** @param {string} selector 输入控件。 @param {string} value 模拟用户输入。 @returns {void} 同时触发输入和提交事件。 */
      const edit = (selector, value) => {
        get(selector).value = value;
        for (const type of ['input', 'change']) get(selector).dispatchEvent(new Event(type, { bubbles: true }));
      };
      /** @param {string} name 图片文件名。 @returns {DataTransfer} 用于选择、拖放或粘贴的图片。 */
      const picture = name => {
        const transfer = new DataTransfer();
        transfer.items.add(new File([bytes], name, { type: 'image/png' }));
        return transfer;
      };
      /** @param {string} id 服饰 ID。 @returns {object} 从快照读回的记录。 */
      const saved = (id = initial.id) => JSON.parse(store.get(storageKey)).items.find(item => item.id === id);
      /** @param {Function} ready 异步操作完成条件。 @param {string} message 超时信息。 @returns {Promise<void>} 等候上传或模型替身。 */
      async function until(ready, message) {
        for (let tries = 0; tries < 120; tries++) {
          if (ready()) return;
          await new Promise(resolve => setTimeout(resolve, 20));
        }
        throw new Error(message);
      }
      const primary = '#grid [data-id="inspector"]';
      const save = '[data-ui="save-item-basics"]';
      const restore = '[data-ui="restore-item-basics"]';
      const discard = '#modalInspectorDiscard';
      const world = '[data-pane="inspPaneWorld"]';
      const ai = '[data-pane="inspPaneAI"]';
      const basic = '[data-pane="inspPaneBasic"]';
      click(`${primary} .cmeta-t`);
      const inspector = get('#galleryInspector');
      const footer = get('#galleryInspector .insp-f');
      const panel = get('#panel');
      const footerBounds = footer.getBoundingClientRect();
      check(footerBounds.height > 0 && footerBounds.bottom <= panel.getBoundingClientRect().bottom
        && footerBounds.right <= panel.getBoundingClientRect().right && get('#inspId').textContent === '#inspector'
        && get('#inspUnsaved').hidden && get(save).disabled, '桌面和窄屏均应看到底部操作与服饰编号');
      if (matchMedia('(max-width: 960px)').matches) {
        check(inspector.getRootNode().activeElement.dataset.ui === 'close-detail', '窄屏展开详情后应聚焦返回按钮');
      }
      edit('#inspTitle', ' ');
      click(save);
      check(get('#panelOpenNotice').textContent.includes('标题') && inspector.getRootNode().activeElement.id === 'inspTitle', '空标题应提示并聚焦');
      edit('#inspTitle', '保存后的外套');
      edit('#inspBack', 'blob:invalid');
      click(save);
      check(get('#panelOpenNotice').textContent.includes('HTTP') && saved().title === initial.title, '无效图链应阻止整次保存');
      get('#inspFrontFile').files = picture('选择正面.png').files;
      get('#inspFrontFile').dispatchEvent(new Event('change'));
      const oldPreview = get('#inspImgFront').src;

      get('#inspFront').dispatchEvent(new ClipboardEvent('paste', { clipboardData: picture('粘贴正面.png'), bubbles: true, cancelable: true }));
      get('#inspBackSlot').dispatchEvent(new DragEvent('drop', { dataTransfer: picture('拖放背面.png'), bubbles: true, cancelable: true }));
      const front = get('#inspImgFront').src, back = get('#inspImgBack').src;
      check(front.startsWith('blob:') && back.startsWith('blob:') && front !== oldPreview && front !== back

        && await nativeFetch(oldPreview).then(() => false, () => true), '选文件、粘贴、拖放应各自更新视角并释放被替换的预览');

      click(ai);
      edit('#inspAIStyle', 'tags');

      act('workshop-generate', '#inspPaneAI');
      await until(() => Boolean(finishGeneration), '工坊应读取本地图片并启动请求');

      get('#addTitle').value = '另外新增的服饰';
      get('#addOutfitForm').requestSubmit();
      check(!get('#modalAddOutfit').open && get('#inspId').textContent === '#inspector' && get('#inspDesc').value === '想继续编辑',
        '新增另一张卡后应保留正在编辑的右栏');
      click('#grid [data-id="other"] .cmeta-t');
      check(get(discard).open && get('#inspId').textContent === '#inspector', '切卡前应保护当前草稿');
      get(discard).dispatchEvent(new Event('cancel', { bubbles: true, cancelable: true }));
      check(!get(discard).open && get('#inspDesc').value === '想继续编辑', 'Esc 应取消放弃并恢复编辑');
      edit('#gallerySearch', '另一件');
      await until(() => get(discard).open, '搜索移走当前卡前应确认');
      check(get('#gallerySearch').value === '' && get(primary), '确认前应恢复原搜索和列表');
      act('close-modals', `${discard} .modal-f`);
      click('#gallerySidebar [data-owner="USER 玩家"]');
      click('#gallerySidebar [data-filter="favorite"]');
      check(get(primary) && !get(discard).open && get('#inspDesc').value === '想继续编辑', '跨归属视图和收藏筛选应保留仍可见的草稿');
      act('insp-toggle-fav');
      check(get(discard).open && saved().fav, '收藏筛选中取消收藏应先确认且暂未写入');
      act('close-modals', `${discard} .modal-f`);
      click('#gallerySidebar [data-filter="all"]');
      act('insp-toggle-eq-user');
      check(get(discard).open && saved().equippedUser, '取消跨归属装备会移出画廊，应先保护草稿');
      act('close-modals', `${discard} .modal-f`);
      if (matchMedia('(max-width: 960px)').matches) {
        get('[data-ui="close-detail"]').focus();
        act('close-detail');
        check(get(discard).open, '返回画廊前应确认');
        act('close-modals', `${discard} .modal-f`);
        check(inspector.getRootNode().activeElement.dataset.ui === 'close-detail', '取消返回应归还焦点');
      }
      click('#matrixWorkspaceTab');
      check(get(discard).open && get('#wsMatrix').hidden, '切搭配台前应确认');
      act('close-modals', `${discard} .modal-f`);

      holdUpload = true;
      get('#inspFrontFile').files = picture('待取消.png').files;
      get('#inspFrontFile').dispatchEvent(new Event('change'));
      const uploadCount = uploads.length;
      click(save);
      await until(() => uploads.length === uploadCount + 1, '应发起可取消的上传');
      WardrobePanel.close();
      check(get(discard).open, '关闭衣柜前应确认');
      act('discard-inspector', discard);
      await until(() => uploadAborted, '确认放弃应取消在途上传');
      check(!panel.open && saved().desc === result.description, '确认关闭应丢弃草稿并保留已保存状态');

      await reloadWardrobe();
      WardrobePanel.open();
      click(`${primary} .cmeta-t`);
      click(ai);
      check(get('#inspAIPrompt').value === result.prompt && get('#inspAIInstruction').value === '突出面料', '重载脚本后应恢复此服饰工坊');
      click('#grid [data-id="other"] .cmeta-t');
      click(ai);
      check(!get('#inspAIPrompt').value && get('#inspAIIncludeImages').checked && get('#inspUnsaved').hidden, '切旧卡应恢复默认工坊，避免串卡');
      click(world);
      check(get('#inspWorldbook').value === other.boundWorldbook && get('#wbStateHint').textContent.includes('不可用'), '失效绑定应可查看并可更换');
      click('#grid [data-id="outfit"] .cmeta-t');
      check(get(ai).hidden && get('#inspBasicFields').disabled && !get('#inspFrontZoom').disabled && get(save).disabled, '套装右栏应只读基本属性并可预览');
      click(world);
      act('toggle-wb-enable');
      edit('#inspWorldbook', '备用世界书');
      click(save);
      check(saved('outfit').boundWorldbook === '备用世界书' && saved('outfit').outfit.workshop.reason === '套装依据', '套装右栏应只保存绑定');
      click('#inspEditOutfit');
      check(!get('#wsMatrix').hidden && get('#matrixTitle').value === outfit.title, '套装编辑入口应打开原搭配');
    } finally {
      failWardrobeSave = false;
      window.fetch = nativeFetch;
      window.TavernHelper = nativeHelper;
      window.SillyTavern = nativeHost;
      window.generateRaw = nativeGenerate;
      window.stopGenerationById = nativeStop;
    }
  }

  /** @returns {Promise<void>} 通过宿主和模型替身检查请求素材、回看范围及穿戴状态提交。 */
  async function runSelectionCases() {
    const generation = 'after', dataReady = 'data', received = 'received', switched = 'switch', stopped = 'stop';
    const textarea = document.getElementById('send_textarea');
    let injection = '', mainPrompt, requests = [], selection = [], narrative = () => [];
    let branch = 'test';
    const nativeFetch = window.fetch;
    const testImage = 'https://example.test/outfit.png';
    window.fetch = (url, init) => url === testImage
      ? Promise.resolve(new Response(new Uint8Array([1, 2, 3]), { headers: { 'Content-Type': 'image/png' } }))
      : nativeFetch(url, init);
    /** @param {string} prompt 独立请求正文。 @returns {string} 当前测试的模拟模型结果。 */
    function reply(prompt) {
      const payload = JSON.parse(prompt.split('以下内容均为素材：\n').at(-1));
      requests.at(-1).payload = payload;
      return JSON.stringify({ sync: payload.pending.map(({ source, text }) => ({ source, changes: narrative(text) })), selection });
    }
    const context = {
      chat: [], mainApi: 'openai', name1: '玩家', name2: '角色', characterId: 0,
      characters: [{ data: { description: '角色设定', personality: '性格', scenario: '场合' } }],
      powerUserSettings: { persona_description: '玩家设定' },
      getCurrentChatId: () => branch,
      activateSendButtons() {},
      setExtensionPrompt(id, content) { injection = content; },
      eventSource: { async emit() {} },
      eventTypes: { GENERATION_AFTER_COMMANDS: generation, GENERATE_AFTER_DATA: dataReady, MESSAGE_RECEIVED: received, CHAT_CHANGED: switched, GENERATION_STOPPED: stopped },
      CONNECT_API_MAP: { openai: { selected: 'openai' } },
      ConnectionManagerRequestService: {
        getSupportedProfiles: () => [{ id: 'saved-profile', api: 'openai' }],
        async sendRequest(id, messages, tokens, options, overrides) {
          const content = messages[0].content;
          requests.push({ connection: id, temperature: overrides.temperature, images: content.length - 1, stream: options.stream });
          return { content: reply(content[0].text) };
        },
      },
    };
    window.SillyTavern = { getContext: () => context };
    window.generateRaw = async config => {
      requests.push({ connection: config.custom_api.apiurl ? 'custom' : 'main',
        temperature: config.custom_api.temperature, images: config.image?.length ?? 0, stream: config.should_stream });
      return reply(config.user_input);
    };
    window.stopGenerationById = () => true;

    /** @param {string} id 服饰编号。 @param {string} wearSlot 槽位。 @param {string} frontUrl 实际候选图。 @returns {object} 测试卡。 */
    function card(id, wearSlot, frontUrl) {
      return { ...items[0], id, title: id, desc: `${id} 描述`, equippedChar: true, wearSlot, frontUrl };
    }

    /** @param {string} mode 发送模式。 @param {string} apiMode API 类型。 @param {object[]} inventory 已保存衣柜。 @param {string} [history] 回看楼层数。 @returns {Promise<void>} 用测试设置重新加载。 */
    async function selectOptions(mode, apiMode, inventory, history) {
      context.chat = [];
      requests = [];
      store.set('zhenxin.wardrobe.enabled', 'true');
      store.set(storageKey, JSON.stringify({
        items: inventory,
        settings: { autoSelect: true, injectContent: mode, injectHistory: history, apiMode, apiProfileId: 'saved-profile' },
      }));
      await reloadWardrobe();
    }

    /** @param {string} text 当前测试的输入。 @param {string} [answer] 模拟主模型正文。 @returns {Promise<object>} 已保存回复。 */
    async function completeTurn(text, answer = '普通回复') {
      textarea.value = text;
      await context.eventSource.emit(generation, 'normal', {}, false);
      context.chat.push({ is_user: true, name: '玩家', mes: text, send_date: String(context.chat.length) });
      textarea.value = '';
      mainPrompt = [{ role: 'user', content: text }];
      await context.eventSource.emit(dataReady, { prompt: mainPrompt }, true);
      check(mainPrompt.length === 1 && mainPrompt[0].content === text, '干跑预览应保留原生请求');
      await context.eventSource.emit(dataReady, { prompt: mainPrompt }, false);
      const message = { is_user: false, name: '角色', mes: answer, gen_finished: 1, send_date: String(context.chat.length) };
      context.chat.push(message);
      await context.eventSource.emit(received, context.chat.length - 1, 'normal');
      return message;
    }

    /** @param {string} text 发送失败时应保留的输入。 */
    async function expectSelectionFailure(text) {
      const before = JSON.stringify(context.chat);
      textarea.value = text;
      let canceled = false;
      try {
        await context.eventSource.emit(generation, 'normal', {}, false);
      } catch (error) {
        canceled = error.name === 'AbortError';
      }
      check(canceled && textarea.value === text && JSON.stringify(context.chat) === before && !injection, '非法结果应取消发送且保持快照、草稿和注入完好');
    }

    /** @param {string} id 候选卡编号。 @returns {object} 合法的试穿动作。 */
    const wear = id => ({ who: 'char', action: 'wear', id, reason: '和当前场合相符' });

    /** @param {string} id 服饰编号。 @returns {number|undefined} 已保存的最近使用时间。 */
    const lastUse = id => JSON.parse(store.get(storageKey)).items.find(item => item.id === id)?.lastUsedAt;

    for (const [mode, connection, images, total] of [
      ['text', 'custom', 0, 2], ['image', 'main', 1, 1], ['both', 'profile', 1, 2],
    ]) {
      await selectOptions(mode, connection, [card('有图', 'top', testImage), card('缺图', 'outer')]);
      selection = [wear('有图')];
      await completeTurn('准备出门');
      const request = requests[0];
      check(request.connection === (connection === 'profile' ? 'saved-profile' : connection) && request.temperature === 0.2
        && request.images === images && !request.stream, '三种连接与内容组合应独立调用并使用低温度');
      const { candidates, character, user } = request.payload;
      check(candidates.length === total && (mode === 'image' ? !('description' in candidates[0]) : candidates[0].description === '有图 描述')
        && character.description === '角色设定' && user.description === '玩家设定', '候选应按模式附带预期素材及人物设定');
      const outgoing = JSON.stringify(mainPrompt);
      check(outgoing.includes('有图 描述') === (mode !== 'image') && outgoing.includes('data:image/png;base64,AQID') === (mode !== 'text')
        && !outgoing.includes('缺图 描述'), '主聊天只应按模式收到实际穿上的服饰');
    }

    await selectOptions('image', 'custom', [card('已拆分的上装', 'top'), {
      ...card('有整套图', undefined, testImage), splitParts: [{ id: '已拆分的上装', slot: 'top', source: '【上装】', text: '原文上装' }],
    }]);
    selection = [wear('有整套图')];
    await completeTurn('用整套的图片');
    check(JSON.stringify(mainPrompt).includes('data:image/png;base64,AQID'), '只有母卡有图时，主聊天仍应收到整套图');
    check(lastUse('有整套图') > 0 && lastUse('有整套图') === lastUse('已拆分的上装'), '整套和实际换上的成员应一起记录时间');

    await selectOptions('text', 'custom', [card('旧外套', 'outer'), card('新外套', 'outer'), card('备用帽', 'head')]);
    WardrobePanel.open();
    let gallery = document.getElementById('wardrobe-host').shadowRoot;
    for (let click = 0; click < 2; click++) gallery.querySelector('[data-id="备用帽"] [data-ui="toggle-eq-char"]').click();
    gallery.querySelector('#matrixWorkspaceTab').click();
    gallery.querySelector('#matrixGrid [data-ui="matrix-slot"]').click();
    gallery.querySelector('[data-item-id="备用帽"]').click();
    gallery.querySelector('[data-ws="gallery"]').click();
    gallery.querySelector('[data-filter="recent"]').click();
    check(!lastUse('备用帽') && !gallery.getElementById('galleryEmpty').hidden, '手动装备和加入槽位不应计入最近使用');

    const realNow = Date.now;
    let now = realNow();
    try {
      Date.now = () => now;
      selection = [wear('旧外套')];
      await completeTurn('先穿旧外套');
      const firstWear = now;
      now += 1000;
      selection = [];
      await completeTurn('继续穿这件外套');
      check(lastUse('旧外套') === firstWear, '持续穿戴不应刷新使用时间');
      /** @param {string} selector 可见视图中的卡片选择器。 @returns {string} 按显示顺序排列的 ID。 */
      const recentCards = selector => [...gallery.querySelectorAll(selector)].map(card => card.dataset.id).join(',');
      gallery.querySelector('[data-filter="all"]').click();
      const sort = gallery.getElementById('gallerySort');
      sort.value = 'recent';
      sort.dispatchEvent(new Event('change'));
      selection = [wear('新外套')];
      await completeTurn('换上新外套');
      check(lastUse('新外套') === now && lastUse('旧外套') === firstWear, '新换上的卡应独立记录时间');
      check(recentCards('#grid .card') === '新外套,旧外套,备用帽', '全部服饰按最近使用排序时应随回复实时重排');
      sort.value = 'default';
      sort.dispatchEvent(new Event('change'));
      gallery.querySelector('[data-filter="recent"]').click();
      check(recentCards('#grid .card') === '新外套,旧外套', '最近使用应在画廊中按时间倒序');
      gallery.querySelector('[data-mode="list"]').click();
      check(gallery.getElementById('grid').classList.contains('list')
        && recentCards('#grid .card') === '新外套,旧外套', '列表应保留最近使用顺序');

      selection = [wear('备用帽'), wear('无效编号')];
      await expectSelectionFailure('失败的选衣');
      selection = [wear('备用帽')];
      textarea.value = '随后取消的回复';
      await context.eventSource.emit(generation, 'normal', {}, false);
      check(!lastUse('备用帽'), '宿主尚未确认回复时不得记录使用');
      await context.eventSource.emit(stopped);
      const reply = { is_user: false, name: '角色', mes: '取消后送达', gen_finished: 1 };
      context.chat.push(reply);
      await context.eventSource.emit(received, context.chat.length - 1, 'normal');
      check(!reply.extra && !lastUse('备用帽') && lastUse('新外套') === now, '失败或取消后即使收到回复事件也不得更改记录');
      context.chat.pop();
      textarea.value = '';
      await reloadWardrobe();
      WardrobePanel.open();
      gallery = document.getElementById('wardrobe-host').shadowRoot;
      gallery.querySelector('[data-filter="recent"]').click();
      check(recentCards('#grid .card') === '新外套,旧外套', '重载后应恢复最近使用和排序');
    } finally {
      Date.now = realNow;
    }

    for (const [type, history] of [['normal', '0'], ['regenerate', '1'], ['swipe', '1']]) {
      await selectOptions('text', 'custom', [card('有图', 'top', testImage)], history);
      selection = [];
      context.chat.push({ is_user: true, mes: '过早的前文' }, { is_user: false, mes: '最近的剧情' }, { is_system: true, mes: '隐藏消息' });
      if (type === 'normal') textarea.value = '本次输入';
      else context.chat.push({ is_user: true, mes: '本次输入' }, { is_user: false, mes: '即将替换的回复' });
      await context.eventSource.emit(generation, type, {}, false);
      const { history: readHistory, userInput, pending } = requests[0].payload;
      check(userInput === '本次输入' && readHistory.map(row => row.text).join() === (history === '0' ? '' : '最近的剧情')
        && pending.map(row => row.text).join() === (history === '0' ? '本次输入' : '最近的剧情,本次输入'),
      `${type} 应限量读取前文，并单独同步本次输入`);
      textarea.value = '';
    }

    const inventory = [
      card('旧整套'), card('上衣', 'top'), card('内搭', 'inner'), card('外套', 'outer'),
      card('短袜', 'socks'), card('鞋', 'shoes'), card('头饰', 'head'), card('手饰', 'hand'), card('连身', 'dress'),
    ];
    await selectOptions('text', 'custom', inventory);
    selection = [wear('旧整套')];
    const whole = await completeTurn('穿上整套');
    check(whole.extra.zhenxinWardrobe.turn.state.char[0].slot === 'outfit', '旧卡应可作为整套穿用');
    selection = [wear('上衣')];
    await expectSelectionFailure('不能猜旧套装的上装');
    const mainBranch = context.chat;
    branch = '另一个分支';
    context.chat = [];
    await context.eventSource.emit(switched);
    selection = ['上衣', '内搭', '外套', '短袜', '鞋', '头饰', '手饰'].map(wear);
    const outfit = await completeTurn('多层搭配', '她脱下外套，换上金色鞋履。她想起去年那顶红帽子。');
    check(outfit.extra.zhenxinWardrobe.turn.state.char.length === 7, '内外搭、袜鞋和不同配饰可以并存');
    selection = [];
    narrative = text => text.includes('她脱下外套') ? [
      { who: 'char', slot: 'outer', action: 'remove', quote: '她脱下外套' },
      { who: 'char', slot: 'shoes', action: 'wear', quote: '换上金色鞋履', description: '金色鞋履' },
    ] : [];
    const updated = await completeTurn('保持现在的穿着');
    const parts = updated.extra.zhenxinWardrobe.turn.state.char;
    check(!parts.some(part => part.slot === 'outer') && parts.some(part => part.slot === 'shoes' && part.temporary && part.text === '金色鞋履')
      && parts.some(part => part.slot === 'head' && part.id === '头饰'), '正文只应改动明确部位，库外鞋履应为临时状态');
    check(JSON.parse(store.get(storageKey)).items.length === inventory.length, '库外临时穿戴不得写入服饰库');
    selection = [wear('历来不存在的卡')];
    await expectSelectionFailure('非法候选');
    selection = [wear('连身')];
    await expectSelectionFailure('连身与现有上装冲突');
    selection = [];
    narrative = () => [{ who: 'char', slot: 'top', action: 'remove', quote: '正文从未出现该句' }];
    await expectSelectionFailure('伪造正文引用');
    narrative = () => [];
    branch = 'test';
    context.chat = mainBranch;
    await context.eventSource.emit(switched);
    const restored = await completeTurn('继续沿用旧整套');
    check(restored.extra.zhenxinWardrobe.turn.state.char[0].id === '旧整套', '切回分支应恢复该分支整套状态');
    await selectOptions('text', 'custom', []);
    await completeTurn('没有候选也没有旧正文');
    check(requests.length === 0, '无候选和待同步内容时应直接发送');

    const books = ['测试绑定世界书'];
    const previousHelper = window.TavernHelper;
    window.TavernHelper = { getGlobalWorldbookNames: () => books };
    try {
      await selectOptions('text', 'custom', [
        { ...card('只给玩家', 'top'), equippedUser: true, boundChars: ['玩家'] },
        { ...card('生效角色', 'outer'), equippedUser: true, boundChars: ['角色'], wbEnabled: true, boundWorldbook: books[0] },
        { ...card('失效世界书', 'outer'), wbEnabled: true, boundWorldbook: '未激活' },
        { ...card('没有世界书', 'head'), wbEnabled: true, boundWorldbook: '' },
        { ...card('关闭绑定', 'shoes'), equippedUser: true, wbEnabled: false, boundWorldbook: '未激活' },
      ]);
      selection = [];
      narrative = () => [];
      await completeTurn('检查世界书与人物限制');
      const candidates = requests[0].payload.candidates.map(({ id, owners }) => [id, owners]);
      check(JSON.stringify(candidates) === JSON.stringify([['只给玩家', ['user']], ['生效角色', ['char']], ['关闭绑定', ['user', 'char']]]),
        '候选池应按生效世界书匹配，并分别应用玩家和角色绑定');
      books.length = 0;
      await completeTurn('世界书关闭后再发送');
      check(!requests.at(-1).payload.candidates.some(candidate => candidate.id === '生效角色'), '重新发送时应按最新激活世界书筛选');
    } finally {
      window.TavernHelper = previousHelper;
    }

    context.mainApi = 'textgenerationwebui';
    await selectOptions('text', 'custom', [card('兼容外套', 'outer')]);
    selection = [wear('兼容外套')];
    textarea.value = '文本补全';
    await context.eventSource.emit(generation, 'normal', {}, false);
    check(injection.includes('兼容外套 描述'), '文本补全应继续使用深度注入服装文字');
    await context.eventSource.emit(switched);
    check(!injection, '切换聊天后应清理遗留的深度注入');
    window.fetch = nativeFetch;
  }

  const result = document.getElementById('result');
  run().then(runGalleryCases).then(runGalleryToolbarCases).then(runBatchManagementCases).then(runAddOutfitCases)
    .then(runWardrobeDeletionCases).then(runInspectorCases).then(runSelectionCases).then(() => {
    result.textContent = '衣柜设置、画廊批量操作、新增服饰、衣柜删除、右栏和自动选衣检查通过';
    result.dataset.status = 'pass';
  }).catch(error => {
    result.textContent = error.message;
    result.dataset.status = 'fail';
    console.error(error);
  });
</script>
