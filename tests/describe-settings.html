<!doctype html>
<html lang="zh-CN">
<!-- 从仓库根目录启动静态服务器并用桌面浏览器打开本页。?sidebar=1 只检查侧栏。服务器提供 /lib/jszip.min.js 时用 ?zip=1 加测 ZIP。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衣柜回归检查</title>
<textarea id="send_textarea">测试消息</textarea>
<pre id="result">运行中</pre>
<script>
  const workshopReply = { rating: 'SFW', reason: '测试依据', description: '工坊结果', prompt: '生成提示词' };
  let visionReply = JSON.stringify(workshopReply);
  const category = '鞋履$&';
  const ratingInstruction = '测试分级提示词';
  const mossInstruction = '测试 MOSS 中文生图要求';
  const tagsInstruction = 'test english visual tags';
  const imagePath = '/user/images/fixture.png';
  const imageData = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jvygAAAAASUVORK5CYII=';

  /** @param {string} id 卡片编号。 @param {string} title 名称。 @param {string} rating 尺度。 @param {object} [extra] 类型特有字段。 @returns {object} 已存服饰。 */
  const card = (id, title, rating, extra) => ({
    id, title, rating, category, desc: `${title}的描述`, owner: 'USER 玩家', wardrobeId: 'wb-main',
    frontUrl: imagePath, tags: [], boundChars: [], ...extra,
  });
  const topItem = card('top-item', '上装单品', 'R-15', { wearSlot: 'top' });
  const shoes = card('shoes-item', '鞋履单品', 'SFW', {
    wearSlot: 'shoes', owner: 'Char 角色', category: '初始分类', tags: ['high heels'],
  });
  const blank = card('blank-item', '无等级单品', '无', { wearSlot: 'bottom' });
  const outfit = {
    slots: [{ id: 's2', name: '上装', itemId: topItem.id }, { id: 's3', name: '下装', itemId: blank.id }],
    descriptionEdited: true,
    workshop: { ...workshopReply, description: '', style: 'worldbook', instruction: '', includeImages: false },
  };
  /** @param {string} id 预设键。 @param {string} name 预设名称。 @returns {object} 含全部当前字段的模拟预设；生图默认值与首次运行保持一致。 */
  const preset = (id, name) => ({
    id, name, blurR18: true, showTags: true, injectDepth: '1', injectRole: 'system', injectPosition: 'user_end',
    injectContent: 'text', injectHistory: '12', injectInstruction: '', userSingleTemplate: '{{description}}',
    userWardrobeTemplate: '{{wardrobe}}', charSingleTemplate: '{{description}}', charWardrobeTemplate: '{{wardrobe}}',
    imageSingleTemplate: '', imageWardrobeTemplate: '', outfitDescriptionPrompt: '根据给出的服饰素材描述整套',
    itemDescriptionPrompt: '根据给出的服饰素材描述单品', sendClothingRating: false, clothingRatingPrompt: '',
    mossDescriptionPrompt: '根据给出的服饰素材，为 MOSS 生成中文生图提示词。prompt 使用连贯的中文，突出服装款式、颜色、材质、剪裁、层次与可见细节；保留素材中的明确特征，不编造未提供的人物或场景信息。',
    tagsDescriptionPrompt: '根据给出的服饰素材，为 NovelAI / Stable Diffusion 提取英文视觉特征 Tags。prompt 仅使用英文标签，以英文逗号分隔，突出服装款式、颜色、材质、剪裁、层次与可见细节；不添加解释、重复标签或素材未提供的人物与场景特征。',
  });
  let snapshot = {
    items: [topItem, shoes, blank, card('graded', '已分级套装', 'R-18', { outfit }),
      card('ungraded', '未分级套装', '无', { outfit }), card('empty', '未分级空套装', '无', { outfit: { ...outfit, slots: [] } }),
      card('explicit-whole', '明确部位的整套', 'R-15', { wearSlot: 'outfit' })],
    wardrobes: [{ id: 'wb-main', name: '测试衣柜' }, { id: 'wb-other', name: '备用衣柜' }],
    wardrobeGroups: [{ id: 'wg-test', name: '测试组合', wardrobeIds: ['wb-main', 'wb-other'] }],
    categories: [{ name: category, dot: '#334455' }, { name: '初始分类', dot: '#554433' }],
    settings: { wardrobePresets: [preset('default', '默认'), preset('other', '备选')] },
  };
  const storage = '/user/files/zhenxin.wardrobe.v1.json';
  const requests = [];
  const uploadedImages = new Map();
  const nativeFetch = window.fetch.bind(window);
  let failImageUpload = false, failStateUpload = false;
  let referenceBlob, failReferenceRead = false, referenceReads = 0;
  let selectedOutfit = 'graded';
  let extensionText;
  const context = {
    mainApi: 'openai', chat: [], characterId: 0, name1: '玩家', name2: '角色',
    /** @returns {string} 本地模拟聊天的编号。 */
    getCurrentChatId: () => 'describe-test',
    /** @returns {object} 模拟酒馆文件接口的请求头。 */
    getRequestHeaders: () => ({}),
    /** @param {string} key 注入标识。 @param {string} text 注入正文。 @returns {void} 记录文本补全发送内容。 */
    setExtensionPrompt: (key, text) => { extensionText = text; },
    /** @returns {void} 模拟宿主恢复发送控件。 */
    activateSendButtons() {},
    eventTypes: { GENERATION_AFTER_COMMANDS: 'prepare', GENERATE_AFTER_DATA: 'request', GENERATION_STOPPED: 'stop', MESSAGE_RECEIVED: 'receive' },
    eventSource: {
      /** @returns {Promise<void>} 模拟原酒馆事件总线。 */
      async emit() {},
    },
  };
  window.SillyTavern = {
    /** @returns {object} 模拟的酒馆上下文。 */
    getContext: () => context,
  };
  window.TavernHelper = {
    /** @param {object} request 真实插件提交的生成参数。 @returns {Promise<string|object>} 视觉工坊或选衣协议的示例响应。 */
    async generateRaw(request) {
      requests.push(request);
      if (request.generation_id.startsWith('vision-')) return visionReply;
      return JSON.stringify({
        sync: [{ source: 'input', changes: [] }],
        selection: [
          { who: 'user', action: 'wear', id: selectedOutfit, reason: '测试套装' },
          { who: 'char', action: 'wear', id: shoes.id, reason: '测试独立单品' },
        ],
      });
    },
    /** @returns {boolean} 模拟工坊停止接口。 */
    stopGenerationById: () => true,
  };
  /** @param {string} path 宿主文件或图片地址。 @param {object} [options] 请求选项。 @returns {Promise<Response>} 本地模拟响应。 */
  window.fetch = async (path, options) => {
    if (path === storage) return snapshot ? Response.json(snapshot) : new Response(null, { status: 404 });
    if (path === '/api/files/upload') {
      if (failStateUpload) return new Response(null, { status: 400 });
      const bytes = Uint8Array.from(atob(JSON.parse(options.body).data), character => character.charCodeAt(0));
      snapshot = JSON.parse(new TextDecoder().decode(bytes));
      return Response.json({ path: storage });
    }
    if (path === '/api/images/upload') {
      if (failImageUpload) return new Response(null, { status: 400 });
      const { filename, ch_name, image } = JSON.parse(options.body);
      const storedPath = `/user/images/${ch_name}/${filename}`;
      uploadedImages.set(new URL(storedPath, location.origin).pathname, Uint8Array.from(atob(image), character => character.charCodeAt(0)));
      return Response.json({ path: storedPath });
    }
    if (path === '/api/images/delete') return new Response(null, { status: 200 });
    if (path.startsWith('blob:')) return nativeFetch(path, options);
    if (uploadedImages.has(path)) return new Response(uploadedImages.get(path), { headers: { 'Content-Type': 'image/png' } });
    if (path === imagePath) {
      referenceReads++;
      if (failReferenceRead) return new Response(null, { status: 404 });
      if (referenceBlob) return new Response(referenceBlob, { headers: { 'Content-Type': referenceBlob.type } });
      const bytes = Uint8Array.from(atob(imageData), character => character.charCodeAt(0));
      return new Response(bytes, { headers: { 'Content-Type': 'image/png' } });
    }
    throw new Error(`未预期的请求 ${path}`);
  };

  /** @param {boolean} condition 检查结果。 @param {string} message 失败条件。 @returns {void} 失败时终止用例。 */
  function check(condition, message) {
    if (!condition) throw new Error(message);
  }

  /** @param {Function} condition 等待满足的条件。 @param {string} message 超时条件。 @returns {Promise<void>} 等待宿主异步界面更新。 */
  async function until(condition, message) {
    for (let attempt = 0; attempt < 100; attempt++) {
      if (condition()) return;
      await new Promise(resolve => setTimeout(resolve, 10));
    }
    throw new Error(message);
  }

  /** @param {HTMLInputElement} field 文件控件。 @param {File} file 待导入文件。 @returns {void} 触发真实的导入入口。 */
  function chooseFile(field, file) {
    const transfer = new DataTransfer();
    transfer.items.add(file);
    field.files = transfer.files;
    field.dispatchEvent(new Event('change'));
  }

  /** @param {number} width 宽度。 @param {number} height 高度。 @param {boolean} [noise] 是否填充确定性噪声以生成超限 PNG。 @returns {Promise<Blob>} 真实浏览器图片。 */
  async function sendImageFixture(width, height, noise = false) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    if (noise) {
      const context = canvas.getContext('2d');
      const pixels = context.createImageData(width, height);
      let random = 17;
      for (let offset = 0; offset < pixels.data.length; offset += 4) {
        random = (Math.imul(random, 1664525) + 1013904223) >>> 0;
        pixels.data[offset] = random >>> 24;
        pixels.data[offset + 1] = random >>> 16;
        pixels.data[offset + 2] = random >>> 8;
        pixels.data[offset + 3] = 255;
      }
      context.putImageData(pixels, 0, 0);
    }
    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  /** @returns {Promise<void>} 从源码加载实际发送函数，配合可恢复的浏览器替身验证边界、降质、缩边和取消。 */
  async function checkSendImageLimit() {
    const limit = 900 * 1024;
    const source = await (await nativeFetch('../index.json')).text();
    /** @param {string} name 函数名。 @returns {string} 原始函数声明，避免在产品脚本中暴露测试接口。 */
    const declaration = name => {
      const start = source.search(new RegExp(`  (?:async )?function ${name}\\(`));
      check(start >= 0, `找不到图片函数 ${name}`);
      return source.slice(start, source.indexOf('\n  /**', start));
    };
    let input, originalOverride, encodedOverride, encode, decodeError, abortOnRead, abortOnDecode;
    let downloads = 0, decodes = 0, closes = 0;
    const passes = [];
    const nativeEncode = HTMLCanvasElement.prototype.toBlob;
    /** 仅替换指定输入或编码结果的读取值，真实读文件事件和取消机制仍由浏览器执行。 */
    class BoundaryReader extends FileReader {
      /** @param {Blob} blob 待读文件。 @returns {void} 标记来源并开始原生异步读取。 */
      readAsDataURL(blob) { this.original = blob === input; super.readAsDataURL(blob); abortOnRead?.abort(); }
      /** @returns {string|null} 边界替身或浏览器读取的实际内容。 */
      get result() { return (this.original ? originalOverride : encodedOverride) ?? super.result; }
    }
    const host = {
      FileReader: BoundaryReader,
      /** @param {Blob} blob 原图。 @returns {Promise<ImageBitmap>} 可统计释放次数的真实位图。 */
      async createImageBitmap(blob) {
        decodes++;
        if (decodeError) throw new Error('测试解码失败');
        const bitmap = await createImageBitmap(blob);
        const close = bitmap.close.bind(bitmap);
        /** @returns {void} 统计实际位图释放，包括解码完成后才发现取消的情况。 */
        bitmap.close = () => { closes++; close(); };
        abortOnDecode?.abort();
        return bitmap;
      },
    };
    /** @param {object} image 图片来源。 @param {AbortSignal} signal 取消信号。 @returns {Promise<Blob>} 已准备的图片；隔离下载而保留实际读取与压缩代码。 */
    const load = async (image, signal) => { signal.throwIfAborted(); downloads++; return input; };
    const localErrors = new WeakSet();
    /** @param {string} message 本地错误说明。 @returns {Error} 与产品脚本相同语义的已标记异常。 */
    const localError = message => { const error = new Error(message); localErrors.add(error); return error; };
    const constants = source.match(/^  const SEND_IMAGE_(?:MAX_DATA_URL_LENGTH|QUALITIES) = .*;$/gm).join('\n');
    const api = new Function('P', 'PD', 'readWardrobeImage', 'wardrobeDiagnosticError', 'diagnosticLocalErrors', 'diagnosticScope', 'writeDiagnostic',
      `${constants}\n${['readImageDataUrl', 'readWorkshopImage', 'compressSendImage', 'readTurnImage'].map(declaration).join('\n')}
      return { readWorkshopImage, readTurnImage };`)(host, document, load,
      localError, localErrors, () => ({}), () => {});
    /** @param {AbortController} [controller] 本次取消控制器。 @returns {Promise<string>} 通过实际统一入口处理后的图片。 */
    const read = (controller = new AbortController()) => api.readWorkshopImage({ label: '测试图' }, controller.signal, {});
    /** @param {Promise<*>} pending 待失败任务。 @param {RegExp} message 预期原因。 @returns {Promise<void>} 确认失败而非返回错误图片。 */
    const fails = async (pending, message) => pending.then(() => { throw new Error('图片处理应失败却成功返回'); },
      error => check(message.test(error.message), `图片错误原因不符：${error.message}`));
    /** @param {BlobCallback} callback 编码回调。 @param {string} type 编码格式。 @param {number} quality 编码质量。 @returns {void} 记录真实画布，并按需强制编码结果以覆盖难触发的分支。 */
    HTMLCanvasElement.prototype.toBlob = function (callback, type, quality) {
      if (type === 'image/jpeg') {
        passes.push({ width: this.width, height: this.height, quality, pixel: [...this.getContext('2d').getImageData(0, 0, 1, 1).data] });
        if (encode) return encode(callback);
      }
      nativeEncode.call(this, callback, type, quality);
    };
    try {
      for (const [width, height] of [[1, 1], [2400, 1200]]) {
        input = await sendImageFixture(width, height);
        const expected = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(input);
        });
        check(await read() === expected && decodes === 0 && passes.length === 0, '未超限图片被解码、重绘或改写');
      }
      originalOverride = 'data:image/png;base64,' + 'A'.repeat(limit - 'data:image/png;base64,'.length);
      check(await read() === originalOverride && decodes === 0, '恰好达到完整长度安全线的原图未直发');
      originalOverride += 'A';
      let result = await read();
      check(result.startsWith('data:image/jpeg;base64,') && result.length <= limit && passes.length === 1, '安全线上方一字符未触发真实 JPEG 压缩');
      check(passes[0].width === 1280 && passes[0].height === 640 && passes[0].quality === 0.82
        && passes[0].pixel.join(',') === '128,128,128,255', '初始缩放、质量或透明图中灰底错误');
      const jpeg = await createImageBitmap(await (await nativeFetch(result)).blob());
      check(jpeg.width === 1280 && jpeg.height === 640, '实际 JPEG 尺寸与绘制结果不符');
      jpeg.close();

      // 使用真实超限噪声 PNG 验证入口判断，不能仅依靠伪造长度触发压缩。
      input = await sendImageFixture(1600, 1600, true);
      originalOverride = undefined;
      check(input.size > limit, '噪声测试图片未达到超限前提');
      result = await read();
      check(result.length <= limit && result.startsWith('data:image/jpeg;base64,'), '真实超限图片未压到安全线以内');

      const oversized = new Blob([new Uint8Array(700000)], { type: 'image/jpeg' });
      originalOverride = 'data:image/png;base64,' + 'A'.repeat(limit);
      for (const [width, height] of [[2000, 1000], [1000, 2000], [7, 3], [1, 7]]) {
        input = await sendImageFixture(width, height);
        passes.length = 0;
        encodedOverride = undefined;
        /** @param {BlobCallback} callback 编码回调。 @returns {void} 用读取替身精确覆盖输出边界。 */
        encode = callback => {
          encodedOverride = passes.length === 7 ? 'data:image/jpeg;base64,' + 'A'.repeat(limit - 'data:image/jpeg;base64,'.length) : undefined;
          callback(oversized);
        };
        result = await read();
        check(result.length === limit && passes.length === 7, '没有在首次达标时停止压缩');
        check(passes.map(pass => pass.quality).join(',') === '0.82,0.7,0.58,0.46,0.35,0.35,0.35', '降质阶梯错误');
        check(Math.max(passes[0].width, passes[0].height) === Math.min(1280, Math.max(width, height))
          && Math.max(passes[3].width, passes[3].height) === Math.min(960, Math.max(width, height)), '缩放上限错误或放大了小图');
        for (let index = 5; index < passes.length; index++) {
          const previous = Math.max(passes[index - 1].width, passes[index - 1].height);
          const current = Math.max(passes[index].width, passes[index].height);
          check(current === Math.max(1, Math.floor(previous * 0.8)) && current < previous, '继续缩边未使用实际长边或尺寸停滞');
        }
        check(passes.every(pass => pass.width >= 1 && pass.height >= 1 && pass.pixel.join(',') === '128,128,128,255'), '极窄图尺寸无效或重绘丢失中灰底');
      }
      input = await sendImageFixture(1, 1);
      encodedOverride = undefined;
      encode = callback => callback(oversized);
      await fails(read(), /最小尺寸.*900 KiB/);
      for (const invalid of [null, new Blob(['错误格式'], { type: 'image/png' })]) {
        encode = callback => callback(invalid);
        await fails(read(), /编码为 JPEG/);
      }
      encodedOverride = 'data:,';
      encode = callback => callback(oversized);
      await fails(read(), /编码为 JPEG/);
      encodedOverride = undefined;
      encode = () => { throw new Error('测试绘制或编码异常'); };
      await fails(read(), /无法读取或压缩参考图/);
      decodeError = true;
      await fails(read(), /无法读取或压缩参考图/);
      decodeError = false;
      encode = null;

      const before = decodes;
      const canceled = new AbortController();
      canceled.abort();
      await fails(read(canceled), /abort/i);
      check(decodes === before, '已取消的任务仍解码图片');
      abortOnRead = new AbortController();
      await fails(read(abortOnRead), /abort/i);
      abortOnRead = undefined;
      check(decodes === before, '原图读取已取消却继续解码');
      abortOnDecode = new AbortController();
      await fails(read(abortOnDecode), /abort/i);
      abortOnDecode = undefined;
      const duringEncode = new AbortController();
      encode = callback => setTimeout(() => { duringEncode.abort(); callback(oversized); }, 0);
      await fails(read(duringEncode), /abort/i);
      encode = null;
      check(closes === decodes - 1, '失败或取消后未释放全部已创建位图');

      const job = { downloads: new Map(), controller: new AbortController(), log: {} };
      const previousDownloads = downloads;
      const previousDecodes = decodes;
      const first = api.readTurnImage(job, { url: imagePath });
      check(api.readTurnImage(job, { url: imagePath }) === first, '同轮同图未共享处理任务');
      await first;
      check(downloads === previousDownloads + 1 && decodes === previousDecodes + 1, '同轮同图重复下载或压缩');
      check((await read()).length <= limit, '失败或取消后无法重新处理图片');
    } finally {
      HTMLCanvasElement.prototype.toBlob = nativeEncode;
    }
  }

  /**
   * 重新打开真实设置，核对全库部位的顺序、名称、合计及指定分项；关闭时不保存设置。
   * @param {ShadowRoot} root 插件界面。 @param {Object<string, number>} [expected] 本场景需明确核对的部位件数。
   * @returns {void} 统计不符或读取统计改变存档时终止用例。
   */
  function checkStoredWearSlots(root, expected = {}) {
    const before = JSON.stringify(snapshot);
    root.querySelector('[data-ui="open-settings"]').click();
    root.querySelector('[data-ui="cfg-tab"][data-pane="paneData"]').click();
    const slots = new Map([
      ['pending', '待确认'], ['outfit', '整套'], ['inner', '内搭'], ['top', '上装'], ['bottom', '下装'],
      ['dress', '连身'], ['outer', '外搭'], ['socks', '袜品'], ['shoes', '鞋履'], ['head', '头饰'],
      ['neck', '颈饰'], ['hand', '手饰'], ['waist', '腰饰'], ['accessory', '配饰'],
    ]);
    for (const slot of snapshot?.wearSlots ?? []) slots.set(slot.id, slot.name);
    const rows = root.querySelectorAll('#storedWearSlotCounts [data-stored-wear-slot]');
    check(Array.from(rows, row => row.dataset.storedWearSlot).join('/') === Array.from(slots.keys()).join('/'), '存储部位顺序错误、零库存部位缺失或已删除部位残留');
    let total = 0;
    for (const row of rows) {
      const id = row.dataset.storedWearSlot;
      const count = Number.parseInt(row.textContent, 10);
      check(row.closest('.cfg-row').querySelector('b').textContent === slots.get(id), '存储统计没有使用最新部位名称');
      check(Number.isInteger(count) && count >= 0 && row.textContent === `${count} 件`, '部位数量格式错误');
      if (Object.hasOwn(expected, id)) check(count === expected[id], `存储部位 ${id} 应有 ${expected[id]} 件，实际 ${count} 件`);
      total += count;
    }
    const itemCount = snapshot?.items.length ?? 0;
    check(total === itemCount && root.querySelector('#storedItemCount').textContent === `${itemCount} 件`, '部位合计与全库服饰总数不符');
    root.querySelector('#modalSettings .modal-h [data-ui="close-modals"]').click();
    check(JSON.stringify(snapshot) === before, '读取存储统计改变了存档');
  }

  /** @param {ShadowRoot} root 插件界面。 @returns {void} 验证两种筛选与右侧操作位置，以及平台快捷键。 */
  function checkSidebar(root) {
    /** @param {string} selector 控件选择器。 @returns {HTMLElement} 画廊侧栏或搜索控件。 */
    const get = selector => root.querySelector(selector);
    if (!get('#gallerySidebar').getClientRects().length) get('#galleryFilterTrigger').click();
    const manage = get('#galleryManageRange');
    /** @param {HTMLElement} node 按钮或数字。 @returns {number} 相对视口的水平中心线。 */
    const center = node => { const rect = node.getBoundingClientRect(); return rect.left + rect.width / 2; };
    const buttonCenter = center(manage);
    check(buttonCenter > 0 && manage.matches('.icon-btn.sm') && manage.getAttribute('aria-label') === '管理服饰分类'
      && Math.abs(buttonCenter - center(get('#galleryCategories em'))) < 1
      && Math.abs(buttonCenter - center(get('#gallerySidebar .nav em'))) < 1, '分类按钮没有与计数对齐');
    get('[data-mode="wear-slot"]').click();
    check(!get('#galleryWearSlots').hidden && get('#galleryCategories').hidden && manage.getAttribute('aria-label') === '管理穿戴部位'
      && Math.abs(buttonCenter - center(manage)) < 1 && Math.abs(buttonCenter - center(get('#galleryWearSlots em'))) < 1,
      '切换部位页签后按钮位置或计数对齐有误');
    get('[data-mode="category"]').click();
    const hint = new URL(location.href).searchParams.get('shortcut') ?? 'Ctrl+K';
    check(get('#gallerySearchShortcut').textContent === hint, '快捷键提示的平台判断错误');
    get('#panel').dispatchEvent(new KeyboardEvent('keydown', {
      key: 'k', bubbles: true, cancelable: true, ctrlKey: hint === 'Ctrl+K', metaKey: hint === '⌘K',
    }));
    check(root.activeElement === get('#gallerySearch'), '画廊快捷键没有聚焦搜索框');
  }

  /** @returns {Promise<{text: string, images: number, imageUrls: string[]}>} 触发实际宿主事件后读取主请求正文和完整附件。 */
  async function mainRequest() {
    const data = { prompt: [{ role: 'user', content: '测试消息' }] };
    await context.eventSource.emit('prepare', 'normal');
    await context.eventSource.emit('request', data);
    const { content } = data.prompt[0];
    const parts = Array.isArray(content) ? content : [{ type: 'text', text: content }];
    const text = parts.filter(part => part.type === 'text').map(part => part.text).join('\n');
    const imageUrls = parts.filter(part => part.type === 'image_url').map(part => part.image_url.url);
    return { text, images: imageUrls.length, imageUrls };
  }

  /** @param {ShadowRoot} root 插件界面。 @returns {Promise<void>} 验证两处工坊的 JSON 草稿、字段分配和保存重试。 */
  async function checkWorkshopSaves(root) {
    /** @param {string} selector 控件选择器。 @returns {HTMLElement} 实际插件控件。 */
    const get = selector => root.querySelector(selector);
    /** @param {string} selector 控件选择器。 @returns {void} 点击实际插件控件。 */
    const click = selector => get(selector).click();
    /** @param {string} id 卡片编号。 @returns {object} 从模拟酒馆存档读取卡片。 */

    /** @param {string} prefix 工坊前缀。 @param {string} value 描写或 JSON。 @returns {void} 编辑世界书描写并触发草稿更新。 */
    const edit = (prefix, value) => {
      const field = get(`#${prefix}AIDescription`);
      field.value = value;
      field.dispatchEvent(new InputEvent('input', { bubbles: true }));
    };
    const saveInspector = '[data-ui="save-item-basics"]';
    const result = {
      title: '高领针织百褶裙装', category, wearSlot: 'outfit', tags: ['挂脖', '蕾丝'],
      rating: 'R-15', reason: '参考图的分级依据', description: '【上装】高领针织衫【下装】百褶裙', prompt: '高领针织衫配百褶裙',

  /**
   * 通过真实控件和宿主事件检查所有 AI 发图路径，确保失败和取消不会提交无效附件。
   * @param {ShadowRoot} root 插件界面。 @param {Function} configure 应用发送模式及选装选项。
   * @returns {Promise<void>} 发图路径及取消、重试验证完成。
   */
  async function checkSendImageFlows(root, configure) {
    const limit = 900 * 1024;
    const bitmap = window.createImageBitmap;
    const encoder = HTMLCanvasElement.prototype.toBlob;
    let decodes = 0, encodes = 0, holdDecode, decodeStarted;
    /** @param {string} selector 控件选择器。 @returns {HTMLElement} 实际插件控件。 */
    const get = selector => root.querySelector(selector);
    /** @returns {void} 清空单次请求的读取和压缩次数。 */
    const reset = () => { referenceReads = decodes = encodes = 0; };
    /** @param {ImageBitmapSource} blob 解码源。 @returns {Promise<ImageBitmap>} 原生位图，允许在解码期间触发真实取消。 */
    window.createImageBitmap = async blob => {
      decodes++;
      decodeStarted?.();
      if (holdDecode) await holdDecode;
      return bitmap.call(window, blob);
    };
    /** @param {BlobCallback} callback 编码回调。 @param {string} type 格式。 @param {number} quality 质量。 @returns {void} 统计真实 JPEG 编码次数。 */
    HTMLCanvasElement.prototype.toBlob = function (callback, type, quality) {
      if (type === 'image/jpeg') encodes++;
      encoder.call(this, callback, type, quality);
    };
    /** @param {'insp'|'matrix'} prefix 工坊标识。 @returns {Promise<string[]>} 工坊实际提交的图片。 */
    const workshop = async prefix => {
      const count = requests.length;
      const button = get(`[data-ui="workshop-generate"][data-prefix="${prefix}"]`);
      get(`#${prefix}AIIncludeImages`).checked = true;
      button.click();
      await until(() => !button.disabled, `${prefix} 发图未结束`);
      check(requests.length === count + 1, `${prefix} 未提交唯一请求`);
      return requests.at(-1).image;
    };
    /** @param {string[]} images 实际请求附件。 @param {string|null} expected 未超限时的原图。 @returns {void} 校验实际请求内容与本轮去重。 */
    const checkImages = (images, expected) => {
      check(images?.length > 0 && images.every(url => url.length <= limit), '实际请求缺图或存在超限附件');
      if (expected) check(images.every(url => url === expected) && decodes === 0 && encodes === 0, '安全线以内的图片在实际请求中被改写');
      else check(images.every(url => url.startsWith('data:image/jpeg;base64,')) && decodes > 0 && encodes > 0, '实际请求没有复用超限压缩入口');
    };
    try {
      check(!root.querySelector('#injectImageQuality') && !root.querySelector('[data-setting="injectImageQuality"]')
        && snapshot.settings.wardrobePresets.every(preset => !Object.hasOwn(preset, 'injectImageQuality')), '自动限额不应新增画质控件或预设字段');
      for (const large of [false, true]) {
        referenceBlob = await sendImageFixture(large ? 1600 : 2400, large ? 1600 : 1200, large);
        const expected = large ? null : await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(referenceBlob);
        });
        for (const auto of [false, true]) {
          await configure('both', auto);
          reset();
          const count = requests.length;
          const main = await mainRequest();
          checkImages(main.imageUrls, expected);
          if (auto) {
            check(requests.length === count + 1, '额外选装没有提交唯一请求');
            checkImages(requests.at(-1).image, expected);
          }
          check(referenceReads === 1 && decodes === (large ? 1 : 0), '主聊天和候选没有共用同轮图片下载与压缩');
        }
        get('[data-ws="gallery"]').click();
        get('[data-ui="card"][data-id="shoes-item"]').click();
        get('[data-pane="inspPaneAI"]').click();
        reset();
        checkImages(await workshop('insp'), expected);
        // 工坊不保存识图选项，后续切换工作区时恢复原卡片草稿。
        get('[data-ui="restore-item-basics"]').click();
        get('#matrixWorkspaceTab').click();
        if (get('#modalInspectorDiscard').open) get('[data-ui="discard-inspector"]').click();
        get('[data-ui="matrix-open-outfit"][data-id="graded"]').click();
        get('[data-pane="matrixPaneAI"]').click();
        reset();
        checkImages(await workshop('matrix'), expected);
      }

      await configure('both', false);
      failReferenceRead = true;
      check((await mainRequest()).images === 0, '主聊天下载失败后仍附加了无效图片');
      const safePath = '/user/images/safe-reference.png';
      const front = get('#matrixFront').value, back = get('#matrixBack').value;
      uploadedImages.set(safePath, Uint8Array.from(atob(imageData), character => character.charCodeAt(0)));
      try {
        get('#matrixFront').value = imagePath;
        get('#matrixBack').value = safePath;
        const partial = await mainRequest();
        check(partial.images === 1 && partial.text.length > 0 && partial.imageUrls[0] === `data:image/png;base64,${imageData}`,
          '主聊天部分缺图时没有保留文字与成功附件');
      } finally {
        get('#matrixFront').value = front;
        get('#matrixBack').value = back;
        uploadedImages.delete(safePath);
      }
      await configure('both', true);
      const count = requests.length;
      await mainRequest().then(() => { throw new Error('选装缺图仍继续请求'); }, () => {});
      check(requests.length === count, '选装下载失败后仍提交 AI 请求');
      failReferenceRead = false;
      await configure('both', false);

      // 保持 MIME 合法但令内容无法解码，确认真实工坊失败后可重试。
      const valid = referenceBlob;
      referenceBlob = new Blob([new Uint8Array(700000)], { type: 'image/png' });
      const button = get('[data-ui="workshop-generate"][data-prefix="matrix"]');
      const beforeFailure = requests.length;
      button.click();
      await until(() => !button.disabled, '解码失败后工坊按钮未恢复');
      check(requests.length === beforeFailure, '解码失败仍提交工坊请求');
      referenceBlob = valid;
      await workshop('matrix');

      let release;
      holdDecode = new Promise(resolve => { release = resolve; });
      const started = new Promise(resolve => { decodeStarted = resolve; });
      const beforeCancel = requests.length;
      const description = get('#matrixAIDescription').value;
      button.click();
      await started;
      // 隐藏插件走现有取消路径，解码迟到后仍须释放位图并禁止请求与回填。
      WardrobePanel.close();
      release();
      holdDecode = undefined;
      decodeStarted = undefined;
      await until(() => !button.disabled, '取消后工坊按钮未恢复');
      await new Promise(resolve => setTimeout(resolve, 50));
      check(requests.length === beforeCancel && get('#matrixAIDescription').value === description, '取消后的迟到解码仍提交请求或回填');
      WardrobePanel.open();
      await workshop('matrix');
    } finally {
      referenceBlob = undefined;
      failReferenceRead = false;
      window.createImageBitmap = bitmap;
      HTMLCanvasElement.prototype.toBlob = encoder;
    }
  }

  /** @param {ShadowRoot} root 插件界面。 @returns {Promise<void>} 回归检查穿戴部位、标签和图片操作。 */
  async function checkGalleryEditing(root) {
    const panel = root.getElementById('panel');

    const get = selector => root.querySelector(selector);

    const click = selector => get(selector).click();
    /** @param {string} selector 输入框选择器。 @param {string} value 输入值。 @param {string} [inputType] 输入方式。 @returns {void} 更新表单。 */
    const type = (selector, value, inputType) => {
      const input = get(selector);
      input.focus();
      input.value = value;
      input.dispatchEvent(new InputEvent('input', { bubbles: true, inputType }));

    const bytes = Uint8Array.from(atob(imageData), character => character.charCodeAt(0));

    check(get('#modalCatMgr-title').textContent === '服饰分类' && get('#categoryManagerList [data-category="初始分类"]'), '分类管理被部位操作替换');
    click('#modalCatMgr .modal-h [data-ui="close-modals"]');
    click('[data-ui="card"][data-id="shoes-item"]');
    click('#inspTagValues [data-ui="edit-tag"]');
    type('#inspTags', '靴子 下雨', 'insertFromPaste');
    click('#inspTagValues [data-ui="del-tag"][data-idx="1"]');
    type('#inspTags', '皮革');
    check(!get('[data-ui="save-item-basics"]').disabled, '未按回车的特征标签没有进入草稿');
    click('#inspBackPreview');
    check(root.activeElement === get('#inspBackPreview') && !paste(get('#inspBackPreview')) && !get('#inspImgBack').hidden,
      '详情背面没有接收粘贴草稿');
    click('[data-ui="save-item-basics"]');
    await until(() => savedCard(shoes.id).tags.join('/') === '靴子/皮革' && !panel.hasAttribute('aria-busy'),
      '详情标签改名、删除或尾项保存错误');
    check(savedCard(shoes.id).backUrl && savedCard(shoes.id).frontUrl === imagePath, '详情贴图改动了另一视角');

    click('[data-ui="gallery-range-tab"][data-mode="wear-slot"]');
    click(wearFilter('shoes'));
    type('#inspTitle', '筛选前的草稿');
    click(wearFilter('outfit'));
    check(get('#modalInspectorDiscard').open && get(wearFilter('shoes')).classList.contains('on'), '切换部位筛选时没有保护草稿');
    click('#modalInspectorDiscard .modal-f [data-ui="close-modals"]');
    check(get('#inspTitle').value === '筛选前的草稿', '取消切换部位后丢失草稿');
    click('[data-ui="restore-item-basics"]');
    const size = snapshot.items.length;
    const plainText = new DataTransfer();
    plainText.setData('text/plain', '文字');
    check(paste(get('#gallerySearch'), plainText) && paste(get('#gallerySearch')), '搜索框的粘贴被画廊接管');
    click('#gwrap');
    check(root.activeElement === get('#galleryMain'), '画廊留白未获得粘贴焦点');
    check(!paste(get('#galleryMain')), '画廊没有接收图片粘贴');
    await until(() => snapshot.items.length === size + 1 && !panel.hasAttribute('aria-busy'), '普通衣柜没有直接建卡');
    const pasted = snapshot.items.at(-1);
    check(pasted.title === '新服饰' && pasted.frontUrl && !pasted.backUrl && !Object.hasOwn(pasted, 'wearSlot')
      && root.activeElement === get(`[data-id="${pasted.id}"] .cmeta-t`)
      && get('[data-filter="all"]').classList.contains('on'), '粘贴新卡未按默认字段保存或未定位到新卡');
    click(wearFilter('pending'));
    check(get('#inspWearSlot').value === '' && get(wearFilter('pending')).querySelector('em').textContent === '1', '待确认卡没有回显或被筛选');
    checkStoredWearSlots(root, { pending: 1, [custom]: 1 });
    click('[data-filter="all"]');

    click('[data-ui="card"][data-id="shoes-item"]');
    type('#inspTitle', '未保存的标题');
    paste(get('#galleryMain'));
    await until(() => snapshot.items.length === size + 2 && !panel.hasAttribute('aria-busy'), '有编辑草稿时未能单独建卡');
    check(get('#inspTitle').value === '未保存的标题' && !get('#inspUnsaved').hidden, '粘贴建卡覆盖了已有草稿');
    click('[data-ui="restore-item-basics"]');
    failImageUpload = true;
    paste(get('#galleryMain'));
    await until(() => get('#panelOpenNotice').textContent.includes('上传失败') && !panel.hasAttribute('aria-busy'), '上传失败时没有反馈');
    check(snapshot.items.length === size + 2, '上传失败产生了空卡');
    failImageUpload = false;

    get('#wbSelect').value = 'wg-test';
    get('#wbSelect').dispatchEvent(new Event('change', { bubbles: true }));
    paste(get('#galleryMain'));
    check(get('#modalPasteOutfit').open && !get('#pasteWardrobe').value, '组合衣柜没有要求选择存入位置');
    click('#modalPasteOutfit [data-ui="close-modals"]');
    check(!get('#modalPasteOutfit').open && snapshot.items.length === size + 2, '取消选择后仍产生了卡片');
    paste(get('#galleryMain'));
    get('#pasteWardrobe').value = 'wb-other';
    click('[form="pasteOutfitForm"]');
    await until(() => !get('#modalPasteOutfit').open && snapshot.items.length === size + 3, '组合衣柜选定后未能直接保存');
    check(snapshot.items.at(-1).wardrobeId === 'wb-other', '组合中的新卡保存到了错误的衣柜');
    checkStoredWearSlots(root, { pending: 3, [custom]: 1 });
    // 另一衣柜及搜索结果只有部分卡片，存储状态仍须统计全库。
    get('#wbSelect').value = 'wb-other';
    get('#wbSelect').dispatchEvent(new Event('change', { bubbles: true }));
    type('#gallerySearch', '新服饰');
    await new Promise(resolve => requestAnimationFrame(resolve));
    checkStoredWearSlots(root, { pending: 3, [custom]: 1 });
    click('#gallerySearchClear');
    get('#wbSelect').value = 'wb-main';
    get('#wbSelect').dispatchEvent(new Event('change', { bubbles: true }));
    await checkWearSlotTransport(root, custom, parent.id, childId);
    click('[data-filter="all"]');
    click(`[data-ui="card"][data-id="${pasted.id}"]`);
    click('[data-ui="open-item-delete"]');
    click('[data-ui="delete-items"]');
    await until(() => !savedCard(pasted.id) && !get('#modalConfirm').open, '待确认卡删除未完成');
    checkStoredWearSlots(root, { pending: 2, [custom]: 1 });
  }

  /**
   * 从实物导出收集部位，验证删除、保存失败以及 JSON 和 ZIP 导回原母子卡的结果。
   * @param {ShadowRoot} root 插件界面。 @param {string} custom 自定义部位 ID。
   * @param {string} parentId 母卡 ID。 @param {string} childId 子卡 ID。
   * @returns {Promise<void>} 等待全部数据包和卡片操作完成。
   */
  async function checkWearSlotTransport(root, custom, parentId, childId) {
    /** @param {string} selector 控件选择器。 @returns {HTMLElement} 实际导入或管理控件。 */
    const get = selector => root.querySelector(selector);
    /** @param {string} selector 控件选择器。 @returns {void} 执行真实界面动作。 */
    const click = selector => get(selector).click();
    /** @param {string} id 卡片 ID。 @returns {object} 最后成功写入的卡片。 */
    const saved = id => snapshot.items.find(item => item.id === id);
    click('[data-ui="open-settings"]');
    click('[data-ui="cfg-tab"][data-pane="paneInject"]');
    click('#extraApiMode input[value="enabled"]');
    click('[data-ui="save-settings"]');
    await until(() => !get('#modalSettings').open, '无法启用自定义部位选衣测试');
    selectedOutfit = childId;
    await mainRequest();
    context.chat.push({ is_user: true, mes: document.getElementById('send_textarea').value },
      { is_user: false, mes: '测试回复', gen_finished: true });
    await context.eventSource.emit('receive', 1, 'normal');
    await until(() => saved(childId).lastUsedAt, '自定义部位未通过选衣确认');
    check(get('[data-wear-owner="user"] .chat-wear-name').textContent.includes('肩部配饰')
      && get('[data-wear-owner="char"] .chat-wear-name').textContent.includes(shoes.title), '聊天未保存两人的穿戴');
    const formats = new URL(location.href).searchParams.has('zip') ? ['json', 'zip'] : ['json'];
    const packages = new Map();
    click('[data-ui="open-io"]');
    const anchorClick = HTMLAnchorElement.prototype.click;
    let download;
    /** @returns {void} 读取浏览器下载的 Blob，避免真的写文件。 */
    HTMLAnchorElement.prototype.click = function () { download = nativeFetch(this.href).then(response => response.blob()); };
    try {
      for (const format of formats) {
        download = undefined;
        click(`[data-ui="export-wardrobe-items"][data-format="${format}"]`);
        await until(() => download, `${format} 数据包未导出`);
        packages.set(format, await download);
      }
    } finally {
      HTMLAnchorElement.prototype.click = anchorClick;
    }
    const pack = JSON.parse(await packages.get('json').text());
    check(pack.wearSlots.length === 1 && pack.wearSlots[0].id === custom && pack.wearSlots[0].name === '肩部配饰', '数据包缺少自定义部位');
    const input = get('#wardrobeImportFile');
    input.dataset.format = 'json';
    delete pack.wardrobes;
    chooseFile(input, new File([JSON.stringify(pack)], 'old.json', { type: 'application/json' }));
    await until(() => get('#wardrobeImportFeedback').textContent.includes('衣柜名录无效'), '缺衣柜名录的旧包未被拒绝');
    click('#modalIO .modal-h [data-ui="close-modals"]');

    click(`#galleryWearSlots [data-wear-slot="${custom}"]`);
    click('#galleryManageRange');
    click(`#categoryManagerList [data-category="${custom}"] [data-ui="category-delete"]`);
    check(get('#categoryDeletePrompt').textContent.includes('2 件') && get('#categoryDeletePrompt').textContent.includes('待确认'), '删除未说明受影响的母子卡件数');
    failStateUpload = true;
    try {
      click('[data-ui="category-confirm-delete"]');
      await until(() => get('#modalCatMgr .modal-toast[data-kind="error"]') && !get('#modalCatMgr').hasAttribute('aria-busy'), '部位保存失败没有反馈');
      check(saved(childId).wearSlot === custom && get(`#galleryWearSlots [data-wear-slot="${custom}"].on`), '保存失败改变了卡片或筛选');
    } finally {
      failStateUpload = false;
    }
    click('[data-ui="category-confirm-delete"]');
    await until(() => !snapshot.wearSlots.some(slot => slot.id === custom) && !get('#modalCatMgr').hasAttribute('aria-busy'), '部位删除未保存');
    check(saved(childId).wearSlot === undefined && saved(childId).splitParent === parentId && saved(parentId).splitParts[0].id === childId
      && saved(parentId).splitParts[0].slot === '' && get('#galleryWearSlots [data-wear-slot="pending"].on'), '删除部位没有保留母子卡或切到待确认');
    check(get('[data-wear-owner="user"] .chat-wear-name').textContent === '暂无已确认的穿戴'
      && get('[data-wear-owner="char"] .chat-wear-name').textContent.includes(shoes.title), '删除部位时错误丢弃了其它穿戴');
    click('#modalCatMgr .modal-h [data-ui="close-modals"]');
    checkStoredWearSlots(root, { pending: 4 });
    click('#galleryWearSlots [data-wear-slot="outfit"]');
    click('#inspSplit');
    click('[data-ui="save-outfit-split"]');
    await until(() => !get('#modalSplitOutfit').open, '待确认拆分保存未完成');
    check(saved(childId) && saved(parentId).splitParts[0].id === childId, '保存待确认拆分丢失了子卡');

    click('[data-ui="open-io"]');
    for (const [format, blob] of packages) {
      input.dataset.format = format;
      chooseFile(input, new File([blob], `wardrobe.${format}`, { type: blob.type }));
      await until(() => !get('#wardrobeImportDuplicate').hidden, `${format} 回导没有识别已有卡片`);
      click('[data-ui="resolve-wardrobe-import"][data-choice="overwrite"]');
      await until(() => get('#wardrobeImportFeedback').textContent.includes('导入完成'), `${format} 回导未完成`);
      check(saved(childId).wearSlot === custom && saved(parentId).splitParts[0].slot === custom
        && snapshot.wearSlots.some(slot => slot.id === custom && slot.name === '肩部配饰'), `${format} 回导没有恢复部位引用`);
    }
    click('#modalIO .modal-h [data-ui="close-modals"]');
    checkStoredWearSlots(root, { pending: 3, [custom]: 1 });
  }

  /** @returns {Promise<ShadowRoot>} 重新执行实际脚本，等待酒馆助手热重载完成。 */
  async function restartPanel() {
    const previous = window.WardrobePanel;
    const script = document.createElement('script');
    script.src = '../index.json';
    document.body.append(script);
    await until(() => window.WardrobePanel && window.WardrobePanel !== previous, '脚本未完成重载');
    script.remove();
    WardrobePanel.open();
    return document.getElementById('wardrobe-host').shadowRoot;
  }

  /** @returns {Promise<void>} 检查存档重载、旧预设生图字段补齐并写回、错误字段只读恢复及首次运行默认值。 */
  async function checkStartup() {
    const root = await restartPanel();
    check(root.querySelector('#wardrobeStorageError').hidden
      && Array.from(root.querySelectorAll('#inspWearSlot option')).some(option => option.text === '肩部配饰')
      && root.querySelector('#inspWearSlot option[value="top"]').text === '上身', '重载未恢复部位或错误进入只读');
    checkStoredWearSlots(root, { pending: 2 });
    root.querySelector('[data-ui="open-settings"]').click();
    check(root.querySelector('#mossDescriptionPrompt').value === '' && root.querySelector('#tagsDescriptionPrompt').value === '  ', '重载未保留生图空值或生成回退改写了设置');
    const itemsBeforeUpgrade = JSON.stringify(snapshot.items);
    // 模拟实际升级：两个旧预设都缺新字段，其中一个保留已填写的 MOSS 值，确认补齐不会覆盖用户内容。
    for (const entry of snapshot.settings.wardrobePresets) {
      delete entry.mossDescriptionPrompt;
      delete entry.tagsDescriptionPrompt;
    }
    snapshot.settings.wardrobePresets[1].mossDescriptionPrompt = mossInstruction;
    const upgraded = await restartPanel();
    check(upgraded.querySelector('#wardrobeStorageError').hidden, '旧存档仅缺生图字段却进入只读恢复');
    upgraded.querySelector('[data-ui="open-settings"]').click();
    const expectedMoss = upgraded.querySelector('#mossDescriptionPrompt').value;
    const expectedTags = upgraded.querySelector('#tagsDescriptionPrompt').value;
    check(expectedMoss.includes('中文生图提示词') && expectedTags.includes('英文视觉特征 Tags'), '旧存档未回填生图默认值');
    upgraded.querySelector('[data-ui="save-settings"]').click();
    await until(() => !upgraded.querySelector('#modalSettings').open, '升级后的旧存档无法保存');
    check(snapshot.settings.wardrobePresets.every(entry => entry.mossDescriptionPrompt === (entry.id === 'other' ? mossInstruction : expectedMoss)
      && entry.tagsDescriptionPrompt === expectedTags), '保存未将所有预设缺失的生图字段写入 JSON');
    check(JSON.stringify(snapshot.items) === itemsBeforeUpgrade, '补齐生图字段改变了服饰数据');
    const reloaded = await restartPanel();
    check(reloaded.querySelector('#wardrobeStorageError').hidden, '补齐并保存后的存档重载失败');
    for (const key of ['itemDescriptionPrompt', 'mossDescriptionPrompt', 'tagsDescriptionPrompt']) {
      const value = snapshot.settings.wardrobePresets[0][key];
      if (key === 'itemDescriptionPrompt') delete snapshot.settings.wardrobePresets[0][key];
      else snapshot.settings.wardrobePresets[0][key] = null;
      const recovery = await restartPanel();
      check(!recovery.querySelector('#wardrobeStorageError').hidden
        && recovery.querySelector('#wardrobeStorageIssues').textContent.includes(key), '缺当前预设字段的存档未进入只读恢复');
      snapshot.settings.wardrobePresets[0][key] = value;
    }
    snapshot = undefined;
    const fresh = await restartPanel();
    checkStoredWearSlots(fresh);
    fresh.querySelector('[data-ui="open-settings"]').click();
    // 首次运行应直接在设置框中提供完整整套规则，避免只替换生成回退而遗漏可编辑默认值。
    check(fresh.querySelector('#wardrobeStorageError').hidden
      && fresh.querySelector('#outfitDescriptionPrompt').value.startsWith('你是一位同时精通常规服装版型与特殊服饰结构的穿搭还原师。')
      && fresh.querySelector('#outfitDescriptionPrompt').value.includes('【十七、最终输出格式】')
      && fresh.querySelector('#itemDescriptionPrompt').value.includes('描述当前单品'), '首次运行未创建两种默认提示词');
    check(fresh.querySelector('#mossDescriptionPrompt').value.includes('中文生图提示词')
      && fresh.querySelector('#tagsDescriptionPrompt').value.includes('英文视觉特征 Tags'), '首次运行未创建两种默认生图提示词');
  }

  /** @returns {Promise<void>} 在窄屏单独运行侧栏与快捷键用例。 */
  async function runSidebarOnly() {
    await until(() => window.WardrobePanel, '插件未加载');
    WardrobePanel.open();
    checkSidebar(document.getElementById('wardrobe-host').shadowRoot);
  }

  const result = document.getElementById('result');
  const runChecks = new URL(location.href).searchParams.has('sidebar') ? runSidebarOnly : run;
  runChecks().then(() => { result.textContent = 'PASS'; }, error => { result.textContent = `FAIL ${error.stack}`; });
</script>
</html>
