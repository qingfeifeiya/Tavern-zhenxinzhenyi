<html lang="zh-CN">
<!-- 从仓库根目录启动本地静态服务器后用浏览器打开本页。PASS 表示全部检查通过。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衣柜回归检查</title>
<textarea id="send_textarea">测试消息</textarea>
<pre id="result">运行中</pre>
<script>
  const workshopReply = { rating: 'SFW', reason: '测试依据', description: '工坊结果', prompt: '生成提示词' };
  const category = '鞋履$&';
  const ratingInstruction = '测试分级提示词';
  const imagePath = '/user/images/fixture.png';
  const imageData = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jvygAAAAASUVORK5CYII=';

  /** @param {string} id 卡片编号。 @param {string} title 名称。 @param {string} rating 尺度。 @param {object} [extra] 类型特有字段。 @returns {object} 已存服饰。 */
  const card = (id, title, rating, extra) => ({
    id, title, rating, category, desc: `${title}的描述`, owner: 'USER 玩家', wardrobeId: 'wb-main',
    frontUrl: imagePath, tags: [], boundChars: [], ...extra,
  });
  const topItem = card('top-item', '上装单品', 'R-15', { wearSlot: 'top' });
  const shoes = card('shoes-item', '鞋履单品', 'SFW', {
    wearSlot: 'shoes', owner: 'Char 角色', category: '初始分类', tags: ['high heels'],
  });
  const blank = card('blank-item', '无等级单品', '无', { wearSlot: 'bottom' });
  const outfit = {
    slots: [{ id: 's2', name: '上装', itemId: topItem.id }, { id: 's3', name: '下装', itemId: blank.id }],
    descriptionEdited: true,
    workshop: { ...workshopReply, description: '', style: 'worldbook', instruction: '', includeImages: false },
  };
  let snapshot = {
    items: [topItem, shoes, blank, card('graded', '已分级套装', 'R-18', { outfit }),
      card('ungraded', '未分级套装', '无', { outfit }), card('empty', '未分级空套装', '无', { outfit: { ...outfit, slots: [] } }),
      card('explicit-whole', '明确部位的整套', 'R-15', { wearSlot: 'outfit' })],
    wardrobes: [{ id: 'wb-main', name: '测试衣柜' }, { id: 'wb-other', name: '备用衣柜' }],
    wardrobeGroups: [{ id: 'wg-test', name: '测试组合', wardrobeIds: ['wb-main', 'wb-other'] }],
    categories: [{ name: category, dot: '#334455' }, { name: '初始分类', dot: '#554433' }],
    settings: { wardrobePresets: [{ id: 'default', name: '默认' }, { id: 'other', name: '备选' }] },
  };
  const storage = '/user/files/zhenxin.wardrobe.v1.json';
  const requests = [];
  let failImageUpload = false;
  let selectedOutfit = 'graded';
  let extensionText;
  const context = {
    mainApi: 'openai', chat: [], characterId: 0, name1: '玩家', name2: '角色',
    /** @returns {string} 本地模拟聊天的编号。 */
    getCurrentChatId: () => 'describe-test',
    /** @returns {object} 模拟酒馆文件接口的请求头。 */
    getRequestHeaders: () => ({}),
    /** @param {string} key 注入标识。 @param {string} text 注入正文。 @returns {void} 记录文本补全发送内容。 */
    setExtensionPrompt: (key, text) => { extensionText = text; },
    /** @returns {void} 模拟宿主恢复发送控件。 */
    activateSendButtons() {},
    eventTypes: { GENERATION_AFTER_COMMANDS: 'prepare', GENERATE_AFTER_DATA: 'request', GENERATION_STOPPED: 'stop' },
    eventSource: {
      /** @returns {Promise<void>} 模拟原酒馆事件总线。 */
      async emit() {},
    },
  };
  window.SillyTavern = {
    /** @returns {object} 模拟的酒馆上下文。 */
    getContext: () => context,
  };
  window.TavernHelper = {
    /** @param {object} request 真实插件提交的生成参数。 @returns {Promise<string>} 视觉工坊或选衣协议的示例响应。 */
    async generateRaw(request) {
      requests.push(request);
      if (request.generation_id.startsWith('vision-')) return JSON.stringify(workshopReply);
      return JSON.stringify({
        sync: [{ source: 'input', changes: [] }],
        selection: [
          { who: 'user', action: 'wear', id: selectedOutfit, reason: '测试套装' },
          { who: 'char', action: 'wear', id: shoes.id, reason: '测试独立单品' },
        ],
      });
    },
    /** @returns {boolean} 模拟工坊停止接口。 */
    stopGenerationById: () => true,
  };
  /** @param {string} path 宿主文件或图片地址。 @param {object} [options] 请求选项。 @returns {Promise<Response>} 本地模拟响应。 */
  window.fetch = async (path, options) => {
    if (path === storage) return Response.json(snapshot);
    if (path === '/api/files/upload') {
      const bytes = Uint8Array.from(atob(JSON.parse(options.body).data), character => character.charCodeAt(0));
      snapshot = JSON.parse(new TextDecoder().decode(bytes));
      return Response.json({ path: storage });
    }
    if (path === '/api/images/upload') {
      if (failImageUpload) return new Response(null, { status: 400 });
      const { filename, ch_name } = JSON.parse(options.body);
      return Response.json({ path: `/user/images/${ch_name}/${filename}` });
    }
    if (path === imagePath) {
      const bytes = Uint8Array.from(atob(imageData), character => character.charCodeAt(0));
      return new Response(bytes, { headers: { 'Content-Type': 'image/png' } });
    }
    throw new Error(`未预期的请求 ${path}`);
  };

  /** @param {boolean} condition 检查结果。 @param {string} message 失败条件。 @returns {void} 失败时终止用例。 */
  function check(condition, message) {
    if (!condition) throw new Error(message);
  }

  /** @param {Function} condition 等待满足的条件。 @param {string} message 超时条件。 @returns {Promise<void>} 等待宿主异步界面更新。 */
  async function until(condition, message) {
    for (let attempt = 0; attempt < 100; attempt++) {
      if (condition()) return;
      await new Promise(resolve => setTimeout(resolve, 10));
    }
    throw new Error(message);
  }

  /** @returns {Promise<{text: string, images: number}>} 触发实际宿主事件后读取主请求正文和附件。 */
  async function mainRequest() {
    const data = { prompt: [{ role: 'user', content: '测试消息' }] };
    await context.eventSource.emit('prepare', 'normal');
    await context.eventSource.emit('request', data);
    const { content } = data.prompt[0];
    const parts = Array.isArray(content) ? content : [{ type: 'text', text: content }];
    const text = parts.filter(part => part.type === 'text').map(part => part.text).join('\n');
    return { text, images: parts.filter(part => part.type === 'image_url').length };
  }
</script>

<script>
  /** @returns {Promise<void>} 通过真实控件、宿主文件接口和生成事件检查描述服装设置。 */
  async function run() {
    await until(() => window.WardrobePanel, '插件未加载');
    const root = document.getElementById('wardrobe-host').shadowRoot;
    /** @param {string} selector 控件选择器。 @returns {HTMLElement} 插件实际控件。 */
    const get = selector => root.querySelector(selector);
    /** @param {string} selector 控件选择器。 @returns {void} 激活实际控件。 */
    const click = selector => get(selector).click();
    /** @param {string} pane 设置页。 @returns {void} 通过主导航切换。 */
    const settingsPane = pane => click(`[data-ui="cfg-tab"][data-pane="${pane}"]`);
    /** @param {string} pane 描述服装子页。 @returns {void} 通过子导航切换。 */
    const describePane = pane => click(`[data-ui="describe-tab"][data-pane="${pane}"]`);
    /** @param {string} presetId 目标预设。 @returns {void} 模拟选择另一个衣柜预设。 */
    const choosePreset = presetId => {
      get('#wardrobePreset').value = presetId;
      get('#wardrobePreset').dispatchEvent(new Event('change', { bubbles: true }));
    };
    /** @returns {Promise<void>} 保存并等到设置弹窗关闭。 */
    const save = async () => {
      click('[data-ui="save-settings"]');
      await until(() => !get('#modalSettings').open, '设置未成功保存');
    };
    /** @param {string} mode 内容模式。 @param {boolean} [auto] 是否启用自动选衣。 @param {boolean} [sendRating] 是否发送分级。 @returns {Promise<void>} 应用本次请求的预设。 */
    const configure = async (mode, auto = false, sendRating = true) => {
      click('[data-ui="open-settings"]');
      settingsPane('paneInject');
      click(`#injectContent input[value="${mode}"]`);
      click(`#extraApiMode input[value="${auto ? 'enabled' : 'off'}"]`);
      settingsPane('paneDescribe');
      describePane('describeRating');
      const rating = get('[data-setting="sendClothingRating"]');
      if ((rating.getAttribute('aria-checked') === 'true') !== sendRating) rating.click();
      await save();
    };

    WardrobePanel.open();
    click('[data-ui="open-settings"]');
    settingsPane('paneDescribe');
    const visionTab = get('[aria-controls="describeVision"]');
    visionTab.focus();
    check(root.activeElement === visionTab && !get('#describeVision').hidden, '识图页签无法聚焦或默认面板错误');
    check(!get('#modalSettings .modal-f').hidden, '描述服装缺少保存栏');
    check(get('#itemDescriptionVariable').textContent === '{{accCategory}} = 单品分类名', '分类变量提示错误');
    check(get('#itemDescriptionPrompt').value.includes('根据给出的服饰素材'), '旧预设缺少描述默认值');
    get('#outfitDescriptionPrompt').value = '测试套装提示词';
    get('#itemDescriptionPrompt').value = '测试单品 {{accCategory}} / {{accCategory}}';
    describePane('describeRating');
    const rating = get('[data-setting="sendClothingRating"]');
    check(get('#describeVision').hidden && !get('#describeRating').hidden, '分级页签未切换内容');
    check(rating.getAttribute('aria-label') === '发送尺度分级' && rating.getAttribute('aria-checked') === 'false', '分级开关文案或默认值错误');
    get('#clothingRatingPrompt').value = ratingInstruction;
    rating.click();
    settingsPane('panePreset');
    choosePreset('other');
    check(rating.getAttribute('aria-checked') === 'false' && !get('#clothingRatingPrompt').value, '预设切换串值');
    choosePreset('default');
    check(get('#clothingRatingPrompt').value === ratingInstruction, '切换预设丢失草稿');
    settingsPane('paneDescribe');
    await save();

    click('[data-ui="open-settings"]');
    settingsPane('paneDescribe');
    describePane('describeRating');
    get('#clothingRatingPrompt').value = '取消的修改';
    click('#modalSettings .modal-h [data-ui="close-modals"]');
    click('[data-ui="open-settings"]');
    check(get('#clothingRatingPrompt').value === ratingInstruction, '取消设置写入了草稿');
    settingsPane('panePreset');
    const anchorClick = HTMLAnchorElement.prototype.click;
    let exported;
    /** @returns {void} 捕获未挂载链接的导出内容，跳过测试环境中的文件下载。 */
    HTMLAnchorElement.prototype.click = function () {
      exported = JSON.parse(decodeURIComponent(this.href.split(',')[1]));
    };
    try { click('[data-ui="export-wardrobe-preset"]'); }
    finally { HTMLAnchorElement.prototype.click = anchorClick; }
    check(exported.sendClothingRating === true && exported.clothingRatingPrompt === ratingInstruction
      && exported.outfitDescriptionPrompt === '测试套装提示词' && exported.itemDescriptionPrompt.includes('{{accCategory}}'), '导出缺少描述服装设置');
    const legacy = { ...snapshot.settings.wardrobePresets[0], format: 'wardrobe-preset', version: 1, name: '旧预设' };
    for (const key of ['outfitDescriptionPrompt', 'itemDescriptionPrompt', 'sendClothingRating', 'clothingRatingPrompt']) delete legacy[key];
    const transfer = new DataTransfer();
    transfer.items.add(new File([JSON.stringify(legacy)], 'legacy.json', { type: 'application/json' }));
    const file = get('#wardrobePresetFile');
    file.files = transfer.files;
    file.dispatchEvent(new Event('change'));
    await until(() => get('#wardrobePresetName').value === '旧预设', '旧预设未能导入');
    check(rating.getAttribute('aria-checked') === 'false' && get('#outfitDescriptionPrompt').value.includes('根据给出的服饰素材'), '旧预设导入默认值错误');
    click('#modalSettings .modal-h [data-ui="close-modals"]');

    click('[data-ui="card"][data-id="shoes-item"]');
    click('[data-pane="inspPaneAI"]');
    get('#inspAIIncludeImages').checked = false;
    get('#inspCat').value = category;
    click('[data-ui="workshop-generate"][data-prefix="insp"]');
    await until(() => get('#inspAIDescription').value === workshopReply.description, '单品工坊没有回填');
    check(requests.at(-1).user_input.startsWith(`测试单品 ${category} / ${category}\n`), '单品分类变量没有完整替换');
    click('#matrixWorkspaceTab');
    if (get('#modalInspectorDiscard').open) click('[data-ui="discard-inspector"]');
    click('[data-ui="matrix-open-outfit"][data-id="graded"]');
    click('[data-pane="matrixPaneAI"]');
    click('[data-ui="workshop-generate"][data-prefix="matrix"]');
    await until(() => get('#matrixAIDescription').value === workshopReply.description, '套装工坊没有回填');
    check(requests.at(-1).user_input.startsWith('测试套装提示词\n'), '搭配台没有使用套装提示词');

    for (const auto of [false, true]) {
      for (const mode of ['text', 'image', 'both']) {
        await configure(mode, auto);
        const { text, images } = await mainRequest();
        check(text.includes('已分级套装：R-18') && !text.includes('上装单品：R-15'), '套装等级未优先发送');
        check(text.split(ratingInstruction).length === 2, '同一轮分级提示词未发送一次');
        check((images > 0) === (mode !== 'text'), '分级影响了图片模式');
        check(text.includes('的描述') === (mode !== 'image'), '分级影响了描述模式');
        if (auto) {
          check(text.includes('Char 角色 · 鞋履单品：SFW'), '自动选衣丢失独立单品或穿戴者');
          check(!requests.at(-1).user_input.includes(ratingInstruction), '分级提示词进入了额外选衣请求');
        }
      }
    }
    selectedOutfit = 'explicit-whole';
    check((await mainRequest()).text.includes('明确部位的整套：R-15'), '整套标记没有按套装参与选衣');
    selectedOutfit = 'ungraded';
    const automaticFallback = (await mainRequest()).text;
    check(automaticFallback.includes('上装单品：R-15') && !automaticFallback.includes('无等级单品：'), '自动选衣未按已分级单品回退');
    await configure('both');
    click('[data-ui="matrix-open-outfit"][data-id="ungraded"]');
    const manualFallback = (await mainRequest()).text;
    check(manualFallback.includes('上装单品：R-15') && !manualFallback.includes('无等级单品：'), '手动搭配未按已分级单品回退');
    context.mainApi = 'textgenerationwebui';
    await mainRequest();
    check(extensionText.includes('上装单品：R-15') && extensionText.includes(ratingInstruction), '文本补全没有注入分级');
    context.mainApi = 'openai';
    click('[data-ui="matrix-open-outfit"][data-id="empty"]');
    check(!(await mainRequest()).text.includes(ratingInstruction), '没有有效等级时发送了提示词');
    click('[data-ui="matrix-open-outfit"][data-id="graded"]');
    await configure('both', false, false);
    check(!(await mainRequest()).text.includes('服装尺度分级'), '关闭开关后仍发送分级');

    click('[data-ui="open-settings"]');
    settingsPane('paneDescribe');
    describePane('describeVision');
    get('#outfitDescriptionPrompt').value = '  ';
    get('#itemDescriptionPrompt').value = '';
    await save();
    click('[data-pane="matrixPaneAI"]');
    click('[data-ui="workshop-generate"][data-prefix="matrix"]');
    await until(() => !get('[data-ui="workshop-generate"][data-prefix="matrix"]').disabled, '空提示词套装工坊没有完成');
    check(requests.at(-1).user_input.startsWith('根据给出的服饰素材'), '套装提示词留空没有回退');
    click('[data-ws="gallery"]');
    click('[data-ui="card"][data-id="shoes-item"]');
    click('[data-pane="inspPaneAI"]');
    get('#inspAIIncludeImages').checked = false;
    click('[data-ui="workshop-generate"][data-prefix="insp"]');
    await until(() => get('#inspAIDescription').value === workshopReply.description, '空提示词单品工坊没有回填');
    check(requests.at(-1).user_input.startsWith('根据给出的服饰素材'), '单品提示词留空没有回退');
    click('[data-ui="restore-item-basics"]');
    await checkGalleryEditing(root);
  }

  /** @param {ShadowRoot} root 插件界面。 @returns {Promise<void>} 回归检查穿戴部位、标签和图片操作。 */
  async function checkGalleryEditing(root) {
    const panel = root.getElementById('panel');
    /** @param {string} selector 控件选择器。 @returns {HTMLElement} 当前控件。 */
    const get = selector => root.querySelector(selector);
    /** @param {string} selector 控件选择器。 @returns {void} 激活实际控件。 */
    const click = selector => get(selector).click();
    /** @param {string} selector 输入框选择器。 @param {string} value 输入值。 @param {string} [inputType] 输入方式。 @returns {void} 更新表单。 */
    const type = (selector, value, inputType) => {
      const input = get(selector);
      input.focus();
      input.value = value;
      input.dispatchEvent(new InputEvent('input', { bubbles: true, inputType }));
    };
    const bytes = Uint8Array.from(atob(imageData), character => character.charCodeAt(0));
    const picture = new DataTransfer();
    picture.items.add(new File([bytes], 'paste.png', { type: 'image/png' }));
    /** @param {Element} target 当前粘贴区域。 @param {DataTransfer} [data] 剪贴板内容。 @returns {boolean} 是否沿用浏览器默认行为。 */
    const paste = (target, data = picture) => target.dispatchEvent(new ClipboardEvent('paste', {
      bubbles: true, cancelable: true, composed: true, clipboardData: data,
    }));
    /** @param {string} slot 部位键。 @returns {string} 侧栏部位筛选选择器。 */
    const wearFilter = slot => `#galleryWearSlots [data-wear-slot="${slot}"]`;
    /** @param {string} id 服饰编号。 @returns {object|undefined} 宿主保存的服饰。 */
    const savedCard = id => snapshot.items.find(item => item.id === id);

    click('[data-ui="gallery-range-tab"][data-mode="wear-slot"]');
    check(!get('#galleryWearSlots').hidden && get('#galleryCategories').hidden, '穿戴部位页签没有切换列表');
    check(get(wearFilter('outfit')).querySelector('em').textContent === '0', '部位计数没有沿用当前归属');
    click('#galleryToolbar [data-ui="open-add-modal"]');
    check(Array.from(get('#addWearSlot').options).slice(0, 2).map(option => option.label).join('/') === '待确认/整套'
      && get('#addWearSlot').value === '', '新增穿戴选项或默认值错误');
    type('#addTitle', '拆分测试');
    get('#addWearSlot').value = 'outfit';
    get('#addDesc').value = '【上装】针织衫';
    type('#addTags', '针织，纽扣 #蓝色', 'insertFromPaste');
    type('#addTags', '长袖', 'insertText');
    click('#addBackTarget');
    check(root.activeElement === get('#addBackTarget') && !paste(get('#addBackTarget')), '新增背面预览没有接收粘贴');
    check(!get('#addBackPreview').hidden && get('#addFrontPreview').hidden, '图片粘贴到了错误的新增视角');
    for (const event of ['dragover', 'drop']) {
      check(!get('#addFrontTarget').dispatchEvent(new DragEvent(event, { bubbles: true, cancelable: true, dataTransfer: picture })),
        '新增正面预览没有接收拖放');
    }
    click('[form="addOutfitForm"]');
    await until(() => !get('#modalAddOutfit').open, '图片与新卡未成功写入');
    const parent = snapshot.items.at(-1);
    check(parent.wearSlot === 'outfit' && parent.tags.join('/') === '针织/纽扣/蓝色/长袖'
      && parent.frontUrl && parent.backUrl, '整套、标签或正背图保存错误');
    click(wearFilter('outfit'));
    check(get('#inspWearSlot').value === 'outfit' && !get('#inspWearSlot').disabled, '普通整套卡详情没有回显');
    click('#inspSplit');
    check(!get('#splitOutfitParts option[value="outfit"]'), '拆分表把整套列为身体部位');
    click('[data-ui="save-outfit-split"]');
    await until(() => savedCard(parent.id).splitParts?.[0].id && !get('#modalSplitOutfit').open, '整套未能拆分');
    const childId = savedCard(parent.id).splitParts[0].id;
    check(get('#inspWearSlot').disabled && get(wearFilter('top')).querySelector('em').textContent === '1', '拆分后母卡部位或上装计数错误');
    click(wearFilter('top'));
    check(get(`[data-id="${childId}"]`) && get('#inspWearSlot').value === 'top' && get('#inspWearSlot').disabled, '子卡未按上装显示和筛选');
    click(wearFilter('outfit'));
    click('#inspSplit');
    get('#splitOutfitParts select').value = 'outer';
    click('[data-ui="save-outfit-split"]');
    await until(() => savedCard(childId).wearSlot === 'outer' && !get('#modalSplitOutfit').open, '修改母卡后子卡部位未保存');
    check(get(wearFilter('top')).querySelector('em').textContent === '0', '修改拆分后旧部位计数未更新');
    click(wearFilter('outer'));
    check(get('#inspWearSlot').value === 'outer', '修改拆分后子卡详情未更新');

    click('[data-ui="gallery-range-tab"][data-mode="category"]');
    check(get('#galleryWearSlots').hidden && !get('#galleryCategories').hidden && get('[data-filter="all"]').classList.contains('on'),
      '切换页签没有清除部位筛选');
    click('[data-ui="card"][data-id="shoes-item"]');
    click('#inspTagValues [data-ui="edit-tag"]');
    type('#inspTags', '靴子 下雨', 'insertFromPaste');
    click('#inspTagValues [data-ui="del-tag"][data-idx="1"]');
    type('#inspTags', '皮革');
    check(!get('[data-ui="save-item-basics"]').disabled, '未按回车的特征标签没有进入草稿');
    click('#inspBackPreview');
    check(root.activeElement === get('#inspBackPreview') && !paste(get('#inspBackPreview')) && !get('#inspImgBack').hidden,
      '详情背面没有接收粘贴草稿');
    click('[data-ui="save-item-basics"]');
    await until(() => savedCard(shoes.id).tags.join('/') === '靴子/皮革' && !panel.hasAttribute('aria-busy'),
      '详情标签改名、删除或尾项保存错误');
    check(savedCard(shoes.id).backUrl && savedCard(shoes.id).frontUrl === imagePath, '详情贴图改动了另一视角');

    click('[data-ui="gallery-range-tab"][data-mode="wear-slot"]');
    click(wearFilter('shoes'));
    type('#inspTitle', '筛选前的草稿');
    click(wearFilter('outfit'));
    check(get('#modalInspectorDiscard').open && get(wearFilter('shoes')).classList.contains('on'), '切换部位筛选时没有保护草稿');
    click('#modalInspectorDiscard .modal-f [data-ui="close-modals"]');
    check(get('#inspTitle').value === '筛选前的草稿', '取消切换部位后丢失草稿');
    click('[data-ui="restore-item-basics"]');
    const size = snapshot.items.length;
    const plainText = new DataTransfer();
    plainText.setData('text/plain', '文字');
    check(paste(get('#gallerySearch'), plainText) && paste(get('#gallerySearch')), '搜索框的粘贴被画廊接管');
    click('#gwrap');
    check(root.activeElement === get('#galleryMain'), '画廊留白未获得粘贴焦点');
    check(!paste(get('#galleryMain')), '画廊没有接收图片粘贴');
    await until(() => snapshot.items.length === size + 1 && !panel.hasAttribute('aria-busy'), '普通衣柜没有直接建卡');
    const pasted = snapshot.items.at(-1);
    check(pasted.title === '新服饰' && pasted.frontUrl && !pasted.backUrl && !Object.hasOwn(pasted, 'wearSlot')
      && root.activeElement === get(`[data-id="${pasted.id}"] .cmeta-t`)
      && get('[data-filter="all"]').classList.contains('on'), '粘贴新卡未按默认字段保存或未定位到新卡');
    click(wearFilter('pending'));
    check(get('#inspWearSlot').value === '' && get(wearFilter('pending')).querySelector('em').textContent === '1', '待确认卡没有回显或被筛选');
    click('[data-filter="all"]');

    click('[data-ui="card"][data-id="shoes-item"]');
    type('#inspTitle', '未保存的标题');
    paste(get('#galleryMain'));
    await until(() => snapshot.items.length === size + 2 && !panel.hasAttribute('aria-busy'), '有编辑草稿时未能单独建卡');
    check(get('#inspTitle').value === '未保存的标题' && !get('#inspUnsaved').hidden, '粘贴建卡覆盖了已有草稿');
    click('[data-ui="restore-item-basics"]');
    failImageUpload = true;
    paste(get('#galleryMain'));
    await until(() => get('#panelOpenNotice').textContent.includes('上传失败') && !panel.hasAttribute('aria-busy'), '上传失败时没有反馈');
    check(snapshot.items.length === size + 2, '上传失败产生了空卡');
    failImageUpload = false;

    get('#wbSelect').value = 'wg-test';
    get('#wbSelect').dispatchEvent(new Event('change', { bubbles: true }));
    paste(get('#galleryMain'));
    check(get('#modalPasteOutfit').open && !get('#pasteWardrobe').value, '组合衣柜没有要求选择存入位置');
    click('#modalPasteOutfit [data-ui="close-modals"]');
    check(!get('#modalPasteOutfit').open && snapshot.items.length === size + 2, '取消选择后仍产生了卡片');
    paste(get('#galleryMain'));
    get('#pasteWardrobe').value = 'wb-other';
    click('[form="pasteOutfitForm"]');
    await until(() => !get('#modalPasteOutfit').open && snapshot.items.length === size + 3, '组合衣柜选定后未能直接保存');
    check(snapshot.items.at(-1).wardrobeId === 'wb-other', '组合中的新卡保存到了错误的衣柜');
  }

  const result = document.getElementById('result');
  run().then(() => { result.textContent = 'PASS'; }, error => { result.textContent = `FAIL ${error.stack}`; });
</script>
</html>
